name: Order 080 bounded Witness patch apply

"on":
  push:
    branches: [feat/zungun-full-project-v1]
    paths: [.github/order080-patch/READY]

permissions:
  contents: write

concurrency:
  group: order-080-witness-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Verify content-addressed patch
        shell: bash
        run: |
          set -euo pipefail
          dir=.github/order080-patch
          sed "s#  #  $dir/#" "$dir/PART_SHA256" > "$RUNNER_TEMP/parts.sha256"
          sha256sum --check --strict "$RUNNER_TEMP/parts.sha256"
          cat "$dir"/part-{00..10}.patch > "$RUNNER_TEMP/order080.patch"
          expected="$(cut -d' ' -f1 "$dir/SHA256")"
          actual="$(sha256sum "$RUNNER_TEMP/order080.patch" | cut -d' ' -f1)"
          test "$expected" = '55937966194e7c28cbdbf19517e5886e249dbec654384a60323576a5b50c7d2a'
          test "$actual" = "$expected"
          grep '^diff --git a/' "$RUNNER_TEMP/order080.patch" | sed -E 's#^diff --git a/([^ ]+) b/.*#\1#' > "$RUNNER_TEMP/paths.txt"
          test "$(wc -l < "$RUNNER_TEMP/paths.txt")" -eq 43
          ! grep -Eq '^(candidate/order-072|canary/zep-core-canary/vendor/zep-core)/' "$RUNNER_TEMP/paths.txt"
          ! grep -Eq '^\.github/workflows/' "$RUNNER_TEMP/paths.txt"
          git apply --check "$RUNNER_TEMP/order080.patch"
      - name: Apply patch and verify candidate
        shell: bash
        run: |
          set -euo pipefail
          git apply "$RUNNER_TEMP/order080.patch"
          chmod +x tools/e2e/order076-real-e2e.sh
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm test
          npm run test:witness
          npm run test:resilience
          npm run verify:witness-bundle
          npm run verify:docs
          npm run verify:secrets
          git diff --check
          test -z "$(git diff --name-only HEAD -- candidate/order-072 canary/zep-core-canary/vendor/zep-core)"
      - name: Commit verified Witness integration
        shell: bash
        run: |
          set -euo pipefail
          git rm -rf .github/order080-patch
          git add README.md android apps docs package.json packages services tests tools
          test -n "$(git status --porcelain)"
          git config user.name 'Simon Dalmasso'
          git config user.email 'simondalmasso44@gmail.com'
          git commit -m 'feat(order-080): integrate Witness evidence continuity'
          git push origin HEAD:feat/zungun-full-project-v1
