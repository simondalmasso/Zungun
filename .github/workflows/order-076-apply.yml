name: Order 076B apply real E2E payload

"on":
  push:
    branches:
      - feat/zungun-full-project-v1
    paths:
      - .github/order076b-payload/READY

permissions:
  contents: write

concurrency:
  group: order-076b-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct and verify bounded payload
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/chunks.sha256" <<'EOF'
          266becbf350c6bf7cf3026d180c39b533bb48b92e3fb5bf10b7264535f671c69  .github/order076b-payload/chunk-00
          ef709e2b8633c259d86f8487fff94134a8869ac27591994c8b8b49ea279e98ea  .github/order076b-payload/chunk-01
          7445e77a1440503b74c624439039efac093bb2fe6233d7f39e056c8e99afdba1  .github/order076b-payload/chunk-02
          178febedcacd58351a3c2138de0d6ffc4bcfff870d8321f94e8dc6b617ccda96  .github/order076b-payload/chunk-03
          3ddfd559e3e2477f86b975583ab49d46dc242291731cea87f6dc476444e185a5  .github/order076b-payload/chunk-04
          8f3c5477804ab922c61e4fed515aa064ccaa6590a2c6bda1d11f9915b6df4d36  .github/order076b-payload/chunk-05
          875f0c8dd3a0fff94bb63913a9e23956e84ad5eddf81edb6fcc494fd48cce1f8  .github/order076b-payload/chunk-06
          cf459a4a82a2bc7e78f6d98e640780b2fea281a6d406ff265f4fb4a4dba65dd1  .github/order076b-payload/chunk-07
          fd0c574841a77890b958b8e1fee80bbdbe0aa471c8c76e635c9275d08d861e6c  .github/order076b-payload/chunk-08
          8b9bcd57245a5fd308a5425960003d2b7f6937acc3ad7dfa350bed20c8a8c06e  .github/order076b-payload/chunk-09
          EOF
          sha256sum --check --strict "$RUNNER_TEMP/chunks.sha256"
          cat .github/order076b-payload/chunk-{00..09} > "$RUNNER_TEMP/order076b-product.b64"
          base64 --decode "$RUNNER_TEMP/order076b-product.b64" > "$RUNNER_TEMP/order076b-product.tar.gz"
          expected="$(cat .github/order076b-payload/SHA256)"
          actual="$(sha256sum "$RUNNER_TEMP/order076b-product.tar.gz" | cut -d' ' -f1)"
          test "$actual" = "$expected"
          test "$actual" = '14130a8fd71b81ea1e6d4f06b896e571965091ad339dd7f9c01b0c9b8edea14a'
          tar -tzf "$RUNNER_TEMP/order076b-product.tar.gz" | sed '/\/$/d' | LC_ALL=C sort > "$RUNNER_TEMP/payload-files.txt"
          cat > "$RUNNER_TEMP/allowed-files.txt" <<'EOF'
          android/external-consumer/build.gradle.kts
          android/external-consumer/src/androidTest/java/com/zungun/consumer/Order076RealReceiverInstrumentedTest.kt
          android/external-consumer/src/main/AndroidManifest.xml
          android/external-consumer/src/main/java/com/zungun/consumer/ConsumerApplication.kt
          tools/browser/order076-same-operation-e2e.py
          tools/e2e/order076-fault-proxy.mjs
          tools/e2e/order076-real-e2e.sh
          tools/security/generate-evidence.mjs
          EOF
          LC_ALL=C sort -o "$RUNNER_TEMP/allowed-files.txt" "$RUNNER_TEMP/allowed-files.txt"
          diff -u "$RUNNER_TEMP/allowed-files.txt" "$RUNNER_TEMP/payload-files.txt"
          tar -xzf "$RUNNER_TEMP/order076b-product.tar.gz" -C .
          chmod +x tools/e2e/order076-real-e2e.sh
          git rm -rf .github/order076b-payload
          test -z "$(git diff --name-only HEAD -- .github/workflows)"
          test -z "$(git diff --name-only HEAD -- canary/zep-core-canary/vendor/zep-core candidate/order-072)"

      - name: Verify TypeScript and security gates
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run format:check
          npm run lint
          npm run typecheck
          npm test
          npm run test:resilience
          npm run demo:field-service
          npm run verify:pack
          npm run verify:docs
          npm run verify:no-placeholders
          npm run verify:secrets

      - name: Install Android inputs and refresh immutable dependency evidence
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_17_X64"
          sdkroot="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sdkmanager="$sdkroot/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          export ANDROID_SDK_ROOT="$sdkroot" ANDROID_HOME="$sdkroot"
          # `dependencies` alone does not materialize detached AAPT2 transforms.
          # Resolve the actual build graph while generating the immutable evidence.
          android/gradle/bootstrap-gradle.sh -p android --no-daemon --stacktrace \
            --write-locks --write-verification-metadata sha256 \
            :runtime:dependencies :sample:dependencies :external-consumer:dependencies \
            :runtime:clean :runtime:assembleDebug :runtime:assembleRelease :runtime:lintDebug \
            :runtime:testDebugUnitTest :sample:assembleDebug \
            :external-consumer:assembleDebug :external-consumer:assembleDebugAndroidTest
          # Prove the generated locks and metadata are sufficient in strict mode.
          android/gradle/bootstrap-gradle.sh -p android --no-daemon --stacktrace \
            :runtime:clean :runtime:assembleDebug :runtime:assembleRelease :runtime:lintDebug \
            :runtime:testDebugUnitTest :sample:assembleDebug \
            :external-consumer:assembleDebug :external-consumer:assembleDebugAndroidTest
          test -s android/runtime/build/outputs/aar/runtime-release.aar
          test -s android/external-consumer/build/outputs/apk/debug/external-consumer-debug.apk
          test -s android/external-consumer/build/outputs/apk/androidTest/debug/external-consumer-debug-androidTest.apk
          test -s android/gradle/verification-metadata.xml
          test "$(find android -type f -name gradle.lockfile | wc -l)" -ge 3
          npm run verify:security-evidence
          npm audit --registry=https://registry.npmjs.org --audit-level=high --omit=optional

      - name: Commit bounded corrective state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Simon Dalmasso'
          git config user.email 'simondalmasso44@gmail.com'
          git add -A
          test -n "$(git status --porcelain)"
          test -z "$(git diff --cached --name-only -- .github/workflows canary/zep-core-canary/vendor/zep-core candidate/order-072)"
          git commit -m 'test(order-076b): add real Android receiver recovery matrix'
          git push origin HEAD:feat/zungun-full-project-v1
