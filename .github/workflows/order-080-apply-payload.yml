name: Order 080 bounded payload apply

"on":
  push:
    branches: [feat/zungun-full-project-v1]
    paths: [.github/order080-payload/READY]

permissions:
  contents: write

concurrency:
  group: order-080-bounded-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Verify bounded payload
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat .github/order080-payload/SHA256)" = '9c56b90aa6a2a50c263abdcc83259b75d7da322fba28cba1187598ae71354d17'
          base64 --decode .github/order080-payload/payload.b64 > "$RUNNER_TEMP/order080.tar.gz"
          test "$(sha256sum "$RUNNER_TEMP/order080.tar.gz" | cut -d' ' -f1)" = "$(cat .github/order080-payload/SHA256)"
          tar -tzf "$RUNNER_TEMP/order080.tar.gz" | sed '/\/$/d' | LC_ALL=C sort > "$RUNNER_TEMP/payload-files.txt"
          LC_ALL=C sort .github/order080-payload/FILES > "$RUNNER_TEMP/allowed-files.txt"
          diff -u "$RUNNER_TEMP/allowed-files.txt" "$RUNNER_TEMP/payload-files.txt"
          ! grep -Eq '^(candidate/order-072|canary/zep-core-canary/vendor/zep-core)/' "$RUNNER_TEMP/payload-files.txt"
          ! grep -Eq '^\.github/workflows/' "$RUNNER_TEMP/payload-files.txt"
      - name: Apply and verify source
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf "$RUNNER_TEMP/order080.tar.gz" -C .
          chmod +x tools/e2e/order076-real-e2e.sh
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm test
          npm run test:resilience
          npm run verify:docs
          npm run verify:secrets
          git diff --check
          test -z "$(git diff --name-only HEAD -- candidate/order-072 canary/zep-core-canary/vendor/zep-core)"
      - name: Commit fast-forward payload
        shell: bash
        run: |
          set -euo pipefail
          git rm -rf .github/order080-payload
          git add README.md android apps docs package.json packages services tests tools
          test -n "$(git status --porcelain)"
          git config user.name 'Simon Dalmasso'
          git config user.email 'simondalmasso44@gmail.com'
          git commit -m 'feat(order-080): integrate Witness evidence continuity'
          git push origin HEAD:feat/zungun-full-project-v1
