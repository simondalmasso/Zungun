name: Order 083 hardened B startup recovery diagnostic

on:
  push:
    branches: [bootstrap/order-083-production-first]
    paths: [.github/workflows/order-083-r9-b-diagnostic.yml]

permissions:
  contents: read

env:
  CI: "true"
  NO_COLOR: "1"
  ZUNGUN_ORIGIN: https://zungun.simondalmasso44.workers.dev
  PR_BRANCH: feat/zungun-full-project-v1
  EXPECTED_PR_HEAD: 98e846a5888a1772ea415412db86e67bc4a2e55a

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ZUNGUN_PILOT_TOKEN: ${{ secrets.ZUNGUN_PILOT_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.PR_BRANCH }}
          fetch-depth: 0
          persist-credentials: false
      - name: Overlay exact current bootstrap candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_PR_HEAD"
          test "$(git ls-remote origin refs/heads/$PR_BRANCH | awk '{print $1}')" = "$EXPECTED_PR_HEAD"
          for path in \
            tools/order083/android-field-recovery-e2e.sh \
            android/app/src/main/java/com/zungun/app/ZungunApplication.kt \
            android/app/src/androidTest/java/com/zungun/app/Order083FieldRecoveryInstrumentedTest.kt \
            android/runtime/src/main/java/com/zungun/runtime/network/ReceiverTransportClient.kt \
            android/runtime/src/main/java/com/zungun/runtime/delivery/DeliveryWorker.kt \
            android/runtime/src/main/java/com/zungun/runtime/delivery/LinkDeliveryWorker.kt \
            android/runtime/src/main/java/com/zungun/runtime/db/LinkDao.kt; do
            git show "origin/bootstrap/order-083-production-first:$path" > "$path"
          done
          git diff --check
      - name: Install Android API35
        shell: bash
        run: |
          set -euo pipefail
          sdkroot="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}";sdkmanager="$sdkroot/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" platform-tools 'platforms;android-35' 'build-tools;35.0.0' emulator 'system-images;android-35;google_apis;x86_64'
          printf 'ANDROID_SDK_ROOT=%s\nANDROID_HOME=%s\n' "$sdkroot" "$sdkroot" >> "$GITHUB_ENV"
          printf '%s\n' "$sdkroot/platform-tools" >> "$GITHUB_PATH"
      - name: Boot API35 emulator
        shell: bash
        run: |
          set -euo pipefail
          sdkroot="$ANDROID_SDK_ROOT";export ANDROID_USER_HOME="$RUNNER_TEMP/android-home" ANDROID_EMULATOR_HOME="$RUNNER_TEMP/android-home" ANDROID_AVD_HOME="$RUNNER_TEMP/android-home/avd";mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$sdkroot/cmdline-tools/latest/bin/avdmanager" create avd --force -n order083-hardened-b -k 'system-images;android-35;google_apis;x86_64' --device pixel_6
          sudo chmod 666 /dev/kvm || true
          nohup "$sdkroot/emulator/emulator" -avd order083-hardened-b -no-window -noaudio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -accel auto > "$RUNNER_TEMP/emulator.log" 2>&1 &
          timeout 180s adb wait-for-device
          for _ in $(seq 1 120);do [[ "$(adb shell getprop sys.boot_completed 2>/dev/null|tr -d '\r')" == 1 ]]&&exit 0;sleep 2;done
          cat "$RUNNER_TEMP/emulator.log";exit 1
      - name: Execute hardened B and preserve recovery state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/diag" "$RUNNER_TEMP/field"
          export JAVA_HOME="${JAVA_HOME:-${JAVA_HOME_17_X64:-}}"
          android/gradle/bootstrap-gradle.sh -p android --no-daemon --stacktrace :app:assembleDebug :app:assembleDebugAndroidTest
          adb install -r android/app/build/outputs/apk/debug/app-debug.apk >/dev/null
          adb install -r android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk >/dev/null
          RUNNER='com.zungun.app.test/androidx.test.runner.AndroidJUnitRunner'
          run_test(){ local t="$1"; adb shell am instrument -w -r -e class "com.zungun.app.Order083FieldRecoveryInstrumentedTest#$t" "$RUNNER" | tee "$RUNNER_TEMP/field/$t.log"; grep -q 'OK (1 test)' "$RUNNER_TEMP/field/$t.log"; }
          root_output="$(adb root 2>&1 || true)"; printf '%s\n' "$root_output" > "$RUNNER_TEMP/diag/adb-root.txt"; timeout 30s adb wait-for-device
          test "$(adb shell id -u 2>/dev/null|tr -d '\r')" = 0
          IPT="$(adb shell 'command -v iptables'|tr -d '\r')"; IP6T="$(adb shell 'command -v ip6tables' 2>/dev/null|tr -d '\r' || true)"
          delete_rule(){ local bin="$1"; [[ -z "$bin" ]]&&return 0; adb shell "$bin -D OUTPUT -j ZUNGUN083" >/dev/null 2>&1||true; adb shell "$bin -F ZUNGUN083" >/dev/null 2>&1||true; adb shell "$bin -X ZUNGUN083" >/dev/null 2>&1||true; }
          restore(){ delete_rule "$IPT"; delete_rule "$IP6T"; }
          block(){ local bin="$1"; [[ -z "$bin" ]]&&return 0; adb shell "$bin -N ZUNGUN083" >/dev/null 2>&1||adb shell "$bin -F ZUNGUN083" >/dev/null; adb shell "$bin -A ZUNGUN083 -p tcp --dport 443 -j REJECT" >/dev/null; adb shell "$bin -I OUTPUT 1 -j ZUNGUN083" >/dev/null; }
          trap restore EXIT INT TERM
          adb logcat -c
          run_test phaseTrafficProbeOnline
          run_test phase1SetupOnline
          restore; block "$IPT"; block "$IP6T"; run_test phaseTrafficProbeOffline
          run_test phase2QueueOffline
          OP="$(adb shell run-as com.zungun.app cat files/order083-b-operation-id.txt | tr -d '\r\n')"; test -n "$OP"; printf '%s\n' "$OP" > "$RUNNER_TEMP/diag/OPERATION_ID"
          curl --fail --silent --show-error -H "x-zungun-order083-key: $ZUNGUN_PILOT_TOKEN" "$ZUNGUN_ORIGIN/api/v1/_order083/diagnostics/$OP" | tee "$RUNNER_TEMP/diag/backend-before.json"
          jq -e '.fieldOperationCount==0 and .fieldEffectCount==0' "$RUNNER_TEMP/diag/backend-before.json" >/dev/null
          adb shell am force-stop com.zungun.app
          restore; run_test phaseTrafficProbeOnline
          adb shell monkey -p com.zungun.app -c android.intent.category.LAUNCHER 1 >/dev/null
          sleep 2
          set +e
          timeout 35s adb shell am instrument -w -r -e class "com.zungun.app.Order083FieldRecoveryInstrumentedTest#phase3VerifyRecovered" "$RUNNER" | tee "$RUNNER_TEMP/field/phase3VerifyRecovered.log"
          rc=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$rc" > "$RUNNER_TEMP/diag/phase3-instrumentation-rc"
          adb logcat -d -v threadtime > "$RUNNER_TEMP/diag/logcat.txt" 2>&1 || true
          grep -Ei 'WorkManager|WorkerWrapper|LinkWake|LinkDeliveryWorker|DeliveryWorker|HttpURLConnection|Exception|Throwable|zungun' "$RUNNER_TEMP/diag/logcat.txt" > "$RUNNER_TEMP/diag/logcat-focused.txt" || true
          trap - EXIT INT TERM; restore
      - name: Snapshot hardened B Room WorkManager backend
        shell: bash
        run: |
          set -euo pipefail
          adb shell am force-stop com.zungun.app || true
          for suffix in '' '-wal' '-shm'; do
            adb exec-out run-as com.zungun.app cat "databases/zungun-critical-operations.db${suffix}" > "$RUNNER_TEMP/diag/zungun-critical-operations.db${suffix}" 2>/dev/null || true
            adb exec-out run-as com.zungun.app cat "no_backup/androidx.work.workdb${suffix}" > "$RUNNER_TEMP/diag/androidx.work.workdb${suffix}" 2>/dev/null || true
            adb exec-out run-as com.zungun.app cat "databases/androidx.work.workdb${suffix}" > "$RUNNER_TEMP/diag/androidx.work.workdb.database-path${suffix}" 2>/dev/null || true
          done
          adb exec-out run-as com.zungun.app cat shared_prefs/order083-field-recovery.xml > "$RUNNER_TEMP/diag/shared-prefs.xml" 2>/dev/null || true
          DB="$RUNNER_TEMP/diag/zungun-critical-operations.db"; OP="$(cat "$RUNNER_TEMP/diag/OPERATION_ID")"
          sqlite3 -header -column "$DB" "SELECT operationId,state,attempts,lastError,createdAtMs,updatedAtMs FROM operations WHERE operationId='$OP';" | tee "$RUNNER_TEMP/diag/operations.txt"
          sqlite3 -header -column "$DB" "SELECT id,source,kind,occurredAtMs,reference,payloadJson FROM evidence WHERE operationId='$OP' ORDER BY id;" | tee "$RUNNER_TEMP/diag/evidence.txt"
          sqlite3 -header -column "$DB" "SELECT attemptId,attemptNumber,startedAtMs,completedAtMs,status,httpStatus,errorCode FROM transport_attempts WHERE operationId='$OP' ORDER BY startedAtMs;" | tee "$RUNNER_TEMP/diag/attempts.txt"
          sqlite3 -header -column "$DB" "SELECT retryContract,latestSnapshotId,latestPlanId,automaticRetryBlocked,nextEligibilityAtMs,updatedAtMs FROM link_operation_state WHERE operationId='$OP';" | tee "$RUNNER_TEMP/diag/link-state.txt"
          sqlite3 -header -column "$DB" "SELECT planId,decision,reconcileFirst,nextEligibilityAtMs,createdAtMs FROM transmission_plans WHERE operationId='$OP' ORDER BY createdAtMs;" | tee "$RUNNER_TEMP/diag/plans.txt"
          curl --fail --silent --show-error -H "x-zungun-order083-key: $ZUNGUN_PILOT_TOKEN" "$ZUNGUN_ORIGIN/api/v1/_order083/diagnostics/$OP" | tee "$RUNNER_TEMP/diag/backend-after.json"
          for WDB in "$RUNNER_TEMP/diag/androidx.work.workdb" "$RUNNER_TEMP/diag/androidx.work.workdb.database-path"; do
            if [[ -s "$WDB" ]]; then
              sqlite3 -header -column "$WDB" "SELECT id,state,worker_class_name,run_attempt_count,schedule_requested_at,last_enqueue_time FROM workspec ORDER BY last_enqueue_time;" > "$WDB.workspec.txt" || true
              sqlite3 -header -column "$WDB" "SELECT * FROM workname;" > "$WDB.workname.txt" || true
              sqlite3 -header -column "$WDB" "SELECT * FROM dependency;" > "$WDB.dependency.txt" || true
            fi
          done
          adb shell dumpsys jobscheduler com.zungun.app > "$RUNNER_TEMP/diag/jobscheduler.txt" || true
          cat "$RUNNER_TEMP/diag/operations.txt"; cat "$RUNNER_TEMP/diag/evidence.txt"; cat "$RUNNER_TEMP/diag/attempts.txt"; cat "$RUNNER_TEMP/diag/link-state.txt"; cat "$RUNNER_TEMP/diag/plans.txt"; cat "$RUNNER_TEMP/diag/backend-after.json"
          for f in "$RUNNER_TEMP"/diag/*.workspec.txt "$RUNNER_TEMP"/diag/*.workname.txt; do [[ -f "$f" ]] && { echo "--- $f"; cat "$f"; }; done
          tail -n 300 "$RUNNER_TEMP/diag/logcat-focused.txt" || true
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: order083-hardened-b-diagnostic-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/diag
            ${{ runner.temp }}/field
            ${{ runner.temp }}/emulator.log
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
