# Explicit corrective-head trigger; retained as audit context.
name: Order 076 Android bootstrap

"on":
  push:
    branches:
      - feat/zungun-full-project-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: order-076-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install Android SDK inputs
        shell: bash
        run: |
          set -euo pipefail
          sdkroot="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sdkmanager="$sdkroot/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          printf 'ANDROID_SDK_ROOT=%s\nANDROID_HOME=%s\n' "$sdkroot" "$sdkroot" >> "$GITHUB_ENV"
      - name: Snapshot and reset verification metadata
        shell: bash
        run: |
          set -euo pipefail
          previous="$RUNNER_TEMP/verification-metadata.previous.xml"
          cp android/gradle/verification-metadata.xml "$previous"
          rm android/gradle/verification-metadata.xml
          printf 'PREVIOUS_VERIFICATION=%s\n' "$previous" >> "$GITHUB_ENV"
      - name: Resolve root dependency graph and generate locks
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_17_X64"
          android/gradle/bootstrap-gradle.sh -p android --no-daemon --stacktrace \
            --write-locks --write-verification-metadata sha256 \
            :runtime:dependencies :sample:dependencies
      - name: Clean Android build outputs before production
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_17_X64"
          android/gradle/bootstrap-gradle.sh -p android --no-daemon --stacktrace \
            --write-locks --write-verification-metadata sha256 \
            :runtime:clean :sample:clean
      - name: Build producer AAR, publish coordinate, and verify SHA-256
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_17_X64"
          android/gradle/bootstrap-gradle.sh -p android --no-daemon --stacktrace \
            --write-locks --write-verification-metadata sha256 \
            :runtime:assembleDebug :runtime:assembleRelease :runtime:lintDebug \
            :runtime:testDebugUnitTest :sample:assembleDebug \
            :runtime:publishReleasePublicationToOrder080Repository
          aar=android/runtime/build/outputs/aar/runtime-release.aar
          repo="$GITHUB_WORKSPACE/android/runtime/build/order080-repo"
          published="$repo/com/zungun/zungun-runtime/1.0.80/zungun-runtime-1.0.80.aar"
          test -s "$aar"
          test -s "$published"
          sha256sum "$aar" | tee "$RUNNER_TEMP/runtime-release.aar.sha256"
          test "$(sha256sum "$aar" | awk '{print $1}')" = "$(sha256sum "$published" | awk '{print $1}')"
          printf 'ZUNGUN_RUNTIME_REPO=%s\n' "$repo" >> "$GITHUB_ENV"
      - name: Resolve and compile standalone external consumer from declared producer artifact
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_17_X64"
          sha256sum -c "$RUNNER_TEMP/runtime-release.aar.sha256"
          test -f android/external-consumer/settings.gradle.kts
          ! grep -R -F 'project(:runtime)' android/external-consumer android/settings.gradle.kts
          android/gradle/bootstrap-gradle.sh -p android/external-consumer --no-daemon --stacktrace \
            -PzungunRuntimeRepository="$ZUNGUN_RUNTIME_REPO" \
            --write-locks --write-verification-metadata sha256 \
            dependencies assembleDebug assembleDebugAndroidTest
          sha256sum -c "$RUNNER_TEMP/runtime-release.aar.sha256"
      - name: Complete exact dependency verification metadata
        shell: bash
        run: |
          set -euo pipefail
          test -s android/gradle/verification-metadata.xml
          test -s android/external-consumer/gradle/verification-metadata.xml
          python tools/android/test_complete_gradle_verification.py
          python tools/android/test_gradle_supplement.py
          python tools/android/complete-gradle-verification.py \
            --metadata android/gradle/verification-metadata.xml \
            --merge-from "$PREVIOUS_VERIFICATION" \
            --components android/gradle/verification-extra-components.txt \
            --gradle-user-home "${GRADLE_USER_HOME:-$HOME/.gradle}"
      - name: Strict clean before verification replay
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_17_X64"
          android/gradle/bootstrap-gradle.sh -p android --no-daemon --stacktrace \
            :runtime:clean :sample:clean
          android/gradle/bootstrap-gradle.sh -p android/external-consumer --no-daemon --stacktrace \
            -PzungunRuntimeRepository="$ZUNGUN_RUNTIME_REPO" clean
      - name: Strict producer AAR replay and SHA-256 verification
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_17_X64"
          android/gradle/bootstrap-gradle.sh -p android --no-daemon --stacktrace \
            :runtime:assembleDebug :runtime:assembleRelease :runtime:lintDebug \
            :runtime:testDebugUnitTest :sample:assembleDebug \
            :runtime:publishReleasePublicationToOrder080Repository
          aar=android/runtime/build/outputs/aar/runtime-release.aar
          test -s "$aar"
          sha256sum "$aar" | tee "$RUNNER_TEMP/runtime-release.aar.sha256"
      - name: Strict external consumer replay
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_17_X64"
          sha256sum -c "$RUNNER_TEMP/runtime-release.aar.sha256"
          android/gradle/bootstrap-gradle.sh -p android/external-consumer --no-daemon --stacktrace \
            -PzungunRuntimeRepository="$ZUNGUN_RUNTIME_REPO" \
            assembleDebug assembleDebugAndroidTest
          sha256sum -c "$RUNNER_TEMP/runtime-release.aar.sha256"
          find android -type f \( -name 'gradle.lockfile' -o -path '*/gradle/verification-metadata.xml' \) -print | LC_ALL=C sort
          test -s android/gradle/verification-metadata.xml
          test -s android/external-consumer/gradle/verification-metadata.xml
          test "$(find android -type f -name gradle.lockfile | wc -l)" -ge 3
      - name: Archive bootstrap evidence
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/order076-bootstrap"
          mkdir -p "$out/locks"
          while IFS= read -r file; do
            mkdir -p "$out/locks/$(dirname "$file")"
            cp "$file" "$out/locks/$file"
          done < <(find android -type f \( -name 'gradle.lockfile' -o -path '*/gradle/verification-metadata.xml' \) | LC_ALL=C sort)
          cp android/runtime/build/outputs/aar/runtime-release.aar "$out/zungun-runtime-release.aar"
          cp "$RUNNER_TEMP/runtime-release.aar.sha256" "$out/zungun-runtime-release.aar.sha256"
          cp android/sample/build/outputs/apk/debug/sample-debug.apk "$out/sample-debug.apk"
          consumer_apk="$(find android/external-consumer/build/outputs/apk/debug -maxdepth 1 -type f -name '*-debug.apk' -print -quit)"
          test -n "$consumer_apk"
          test -s "$consumer_apk"
          cp "$consumer_apk" "$out/external-consumer-debug.apk"
          find "$out" -type f ! -name MANIFEST.sha256 -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$out/MANIFEST.sha256"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: order076-bootstrap-${{ github.run_id }}
          path: ${{ runner.temp }}/order076-bootstrap
          if-no-files-found: error
          retention-days: 5
          compression-level: 0
