name: Order 083 R13 production diagnostics 500

on:
  push:
    branches: [bootstrap/order-083-production-first]
    paths: [.github/workflows/order-083-r13-live-diagnostic.yml]

permissions:
  contents: read

env:
  CI: "true"
  NO_COLOR: "1"
  WRANGLER_SEND_METRICS: "false"
  ZUNGUN_ORIGIN: https://zungun.simondalmasso44.workers.dev
  EXPECTED_SOURCE: 2b3f8d1674208159b61bd95d738cdeb77d959d3a1e46dba52a3b6fd211caa775
  FAILED_SUBJECT: opC_05ea8840ad5140d9afc93ff5cf5d72fa

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ZUNGUN_PILOT_TOKEN: ${{ secrets.ZUNGUN_PILOT_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 40b388039a7ccea38053c9c059d4332fa81034a5
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22.16.0
          package-manager-cache: false
      - name: Verify deployed R13 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/diag"
          curl --fail --silent --show-error "$ZUNGUN_ORIGIN/version" | tee "$RUNNER_TEMP/diag/version.json"
          test "$(jq -r .sourceBundleSha256 "$RUNNER_TEMP/diag/version.json")" = "$EXPECTED_SOURCE"
      - name: Capture D1 population before reproduction
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.114.0 d1 execute zungun-order083-product-v1 --remote --command "SELECT COUNT(*) AS conversationCount FROM conversations; SELECT COUNT(*) AS fieldOperationCount FROM field_operations; SELECT COUNT(*) AS faultCount FROM order083_faults;" --json > "$RUNNER_TEMP/diag/d1-counts.json"
          jq . "$RUNNER_TEMP/diag/d1-counts.json"
      - name: Reproduce diagnostics while tailing Worker
        shell: bash
        run: |
          set -euo pipefail
          tail_file="$RUNNER_TEMP/diag/tail.txt"
          (timeout 45s npx --yes wrangler@4.114.0 tail zungun --format json > "$tail_file" 2>&1 || true) &
          tail_pid=$!
          sleep 8
          : > "$RUNNER_TEMP/diag/requests.tsv"
          for subject in "$FAILED_SUBJECT" "order083-r13-probe-$(date +%s)"; do
            for attempt in 1 2 3 4 5; do
              out="$RUNNER_TEMP/diag/${subject}-${attempt}.json"
              code="$(curl --silent --show-error --output "$out" --write-out '%{http_code}' -H "x-zungun-order083-key: $ZUNGUN_PILOT_TOKEN" "$ZUNGUN_ORIGIN/api/v1/_order083/diagnostics/$subject" || true)"
              printf '%s\t%s\t%s\n' "$subject" "$attempt" "$code" | tee -a "$RUNNER_TEMP/diag/requests.tsv"
              sleep 1
            done
          done
          wait "$tail_pid" || true
          sed -n '1,240p' "$tail_file" || true
      - name: Classify reproduction without weakening gate
        shell: bash
        run: |
          set -euo pipefail
          awk -F '\t' '$3=="500"{n++} END{print "HTTP500_COUNT=" n+0}' "$RUNNER_TEMP/diag/requests.tsv" | tee "$RUNNER_TEMP/diag/classification.txt"
          awk -F '\t' '$3=="200"{n++} END{print "HTTP200_COUNT=" n+0}' "$RUNNER_TEMP/diag/requests.tsv" | tee -a "$RUNNER_TEMP/diag/classification.txt"
          grep -Ei 'exception|error|zungun-request-failed|durable|sql|internal' "$RUNNER_TEMP/diag/tail.txt" > "$RUNNER_TEMP/diag/tail-focused.txt" || true
          cat "$RUNNER_TEMP/diag/tail-focused.txt" || true
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: order083-r13-live-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/diag
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
