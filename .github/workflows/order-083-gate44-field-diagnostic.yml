name: Order 083 Gate44 field recovery diagnostic

on:
  push:
    branches:
      - bootstrap/order-083-production-first
    paths:
      - .github/workflows/order-083-gate44-field-diagnostic.yml

permissions:
  contents: read

env:
  EXPECTED_HEAD: dc9c893fbbc4a97eddd23aa33a6e82cbbf3d5d73
  ZUNGUN_ORIGIN: https://zungun.simondalmasso44.workers.dev

jobs:
  gate44-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ZUNGUN_PILOT_TOKEN: ${{ secrets.ZUNGUN_PILOT_TOKEN }}
      ORDER083_FIELD_RECOVERY_EVIDENCE: ${{ runner.temp }}/order083-field-recovery
    steps:
      - name: Checkout bootstrap diagnostic
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: bootstrap/order-083-production-first
          path: carrier
          persist-credentials: false
      - name: Checkout exact canonical source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: dc9c893fbbc4a97eddd23aa33a6e82cbbf3d5d73
          path: canonical
          persist-credentials: false
      - name: Fail closed on canonical HEAD
        working-directory: canonical
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22.16.0'
          package-manager-cache: false
      - name: Install Android API35
        run: |
          set -euo pipefail
          sdkroot="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sdkmanager="$sdkroot/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" platform-tools 'platforms;android-35' 'build-tools;35.0.0' emulator 'system-images;android-35;google_apis;x86_64'
          printf 'ANDROID_SDK_ROOT=%s\nANDROID_HOME=%s\n' "$sdkroot" "$sdkroot" >> "$GITHUB_ENV"
          printf '%s\n' "$sdkroot/platform-tools" >> "$GITHUB_PATH"
      - name: Start bounded API35 emulator
        run: |
          set -euo pipefail
          sdkroot="$ANDROID_SDK_ROOT"
          export ANDROID_USER_HOME="$RUNNER_TEMP/order083-android-home"
          export ANDROID_EMULATOR_HOME="$RUNNER_TEMP/order083-android-home"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/order083-android-home/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$sdkroot/cmdline-tools/latest/bin/avdmanager" create avd --force -n order083-api35 -k 'system-images;android-35;google_apis;x86_64' --device pixel_6
          sudo chmod 666 /dev/kvm || true
          nohup "$sdkroot/emulator/emulator" -avd order083-api35 -no-window -noaudio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -accel auto > "$RUNNER_TEMP/order083-emulator.log" 2>&1 &
          timeout 180s adb wait-for-device
          for _ in $(seq 1 120); do
            if [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == 1 ]]; then exit 0; fi
            sleep 2
          done
          cat "$RUNNER_TEMP/order083-emulator.log"
          exit 1
      - name: Run bootstrap-only diagnostic against exact canonical source
        id: gate44
        continue-on-error: true
        env:
          CANONICAL_ROOT: ${{ github.workspace }}/canonical
        run: bash carrier/tools/order083/android-field-recovery-diagnostic.sh
      - name: Seal diagnostic output
        if: always()
        run: |
          printf 'CANONICAL_HEAD=%s\nGATE44_OUTCOME=%s\nDIAGNOSTIC_ONLY=YES\n' "$EXPECTED_HEAD" '${{ steps.gate44.outcome }}' > "$RUNNER_TEMP/order083-gate44-diagnostic.txt"
          find "$ORDER083_FIELD_RECOVERY_EVIDENCE" -maxdepth 3 -type f -print | sort || true
      - name: Upload diagnostic artifact
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: order083-gate44-diagnostic-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/order083-field-recovery
            ${{ runner.temp }}/order083-emulator.log
            ${{ runner.temp }}/order083-gate44-diagnostic.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Preserve fail-closed result
        if: steps.gate44.outcome != 'success'
        run: exit 1
