name: Zungun public-site production release

"on":
  push:
    branches: [recovery/remote-toolchain-v1]
    paths:
      - "cloudflare/public/**"
      - "cloudflare/test/**"
      - "cloudflare/package.json"
      - "tools/public-site/**"
      - "tests/public-site.e2e.ts"
      - "e2e.config.ts"
      - "package.json"
      - "package-lock.json"
      - "README.md"
      - "docs/guides/public-site.md"
      - ".gitignore"
      - ".github/workflows/zungun-public-site-release.yml"

permissions:
  contents: read

concurrency:
  group: zungun-public-site-production
  cancel-in-progress: false

env:
  CI: "true"
  NO_COLOR: "1"
  E2E_TELEMETRY_DISABLED: "1"
  WRANGLER_SEND_METRICS: "false"
  ZUNGUN_ORIGIN: https://zungun.simondalmasso44.workers.dev

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ZUNGUN_PILOT_TOKEN: ${{ secrets.ZUNGUN_PILOT_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22.22.3
          package-manager-cache: false
      - name: Install locked project dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install pinned tester-army/e2e browser runner
        run: npm install --no-save --no-package-lock --no-audit --no-fund e2e@0.21.2 @e2e-dev/web@0.15.2 playwright@1.64.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify Worker contracts and chat outbox
        run: npm --prefix cloudflare run check
      - name: Verify SEO contract before deployment
        run: npm run test:seo
      - name: Browser E2E against the exact local public assets
        shell: bash
        run: |
          set -euo pipefail
          E2E_VIEWPORT=desktop npm run test:e2e:public
          E2E_VIEWPORT=mobile npm run test:e2e:public
      - name: Deploy with the guarded ORDER-083 production procedure
        shell: bash
        run: |
          set -euo pipefail
          ORDER083_EVIDENCE_DIR="$RUNNER_TEMP/zungun-public-site-production" bash tools/order083/deploy-production.sh
      - name: Read-only live browser E2E against the deployed Worker
        shell: bash
        run: |
          set -euo pipefail
          APP_URL="$ZUNGUN_ORIGIN" E2E_VIEWPORT=desktop npm run test:e2e:public
          APP_URL="$ZUNGUN_ORIGIN" E2E_VIEWPORT=mobile npm run test:e2e:public
