name: SMS companion Android build
on:
  pull_request:
    paths:
      - 'android/app/**'
      - 'android/settings.gradle.kts'
      - 'android/build.gradle.kts'
      - '.github/workflows/sms-companion-android.yml'
  push:
    branches:
      - feature/web-sms-bridge
    paths:
      - 'android/app/**'
      - 'android/settings.gradle.kts'
      - 'android/build.gradle.kts'
      - '.github/workflows/sms-companion-android.yml'
jobs:
  companion-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          sdkmanager="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Build companion APK and run JVM tests
        run: |
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export ANDROID_SDK_ROOT
          android/gradle/bootstrap-gradle.sh -p android --no-daemon --stacktrace :app:assembleDebug :app:testDebugUnitTest
      - name: Upload debug APK for phone-side verification
        uses: actions/upload-artifact@v4
        with:
          name: zungun-sms-companion-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
