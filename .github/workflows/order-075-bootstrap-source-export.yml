name: Order 075 bootstrap source export

"on":
  pull_request:
    branches:
      - recovery/order-072-oracle-extension-candidate-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: order-075-bootstrap-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  export-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify Order 075 ancestry and create deterministic source bundle
        shell: bash
        env:
          START_SHA: 8b206b91fb98bc3d514f9709b6258dcb839ad5f1
          START_TREE: d729a39e0d92ccf3ee3335412d68dfe6d3073387
        run: |
          set -euo pipefail
          test "$(git rev-parse "$START_SHA^{tree}")" = "$START_TREE"
          git merge-base --is-ancestor "$START_SHA" HEAD
          test -z "$(git status --porcelain)"
          out="$RUNNER_TEMP/order075-bootstrap"
          mkdir -p "$out"
          git ls-files -z | LC_ALL=C sort -z | xargs -0 sha256sum > "$out/SOURCE-SHA256SUMS.txt"
          git ls-files | LC_ALL=C sort > "$out/SOURCE-FILES.txt"
          tar --format=ustar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -czf "$out/zungun-source.tar.gz" --files-from="$out/SOURCE-FILES.txt"
          sha256sum "$out/zungun-source.tar.gz" > "$out/zungun-source.tar.gz.sha256"
          printf 'HEAD=%s\nTREE=%s\nSTART_SHA=%s\nSTART_TREE=%s\n' \
            "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" "$START_SHA" "$START_TREE" > "$out/context.txt"
          test -z "$(git status --porcelain)"

      - name: Upload deterministic source bundle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: zungun-order075-bootstrap-source-${{ github.run_id }}
          path: ${{ runner.temp }}/order075-bootstrap
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          include-hidden-files: true
