name: Public site SEO and browser E2E

"on":
  push:
    branches: [feat/public-site-seo-e2e-v1]
    paths:
      - "cloudflare/public/**"
      - "cloudflare/test/**"
      - "cloudflare/package.json"
      - "tools/public-site/**"
      - "tests/public-site.e2e.ts"
      - "e2e.config.ts"
      - "package.json"
      - ".gitignore"
      - ".github/workflows/public-site-e2e.yml"
  pull_request:
    branches: [recovery/remote-toolchain-v1]
    paths:
      - "cloudflare/public/**"
      - "cloudflare/test/public-site-seo.test.mjs"
      - "cloudflare/test/chat-outbox.test.mjs"
      - "tools/public-site/**"
      - "tests/public-site.e2e.ts"
      - "e2e.config.ts"
      - "package.json"
      - ".gitignore"
      - ".github/workflows/public-site-e2e.yml"

permissions:
  contents: read

concurrency:
  group: zungun-public-site-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NO_COLOR: "1"
  E2E_TELEMETRY_DISABLED: "1"

jobs:
  public-site:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22.22.3
          package-manager-cache: false
      - name: Install locked project dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install pinned tester-army/e2e browser runner
        run: npm install --no-save --no-package-lock --no-audit --no-fund e2e@0.21.2 @e2e-dev/web@0.15.2 playwright@1.64.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify Worker and offline outbox contracts
        run: npm --prefix cloudflare run check
      - name: Verify SEO, metadata, sitemap, and robots contracts
        run: npm run test:seo
      - name: Browser E2E on desktop and mobile viewports
        shell: bash
        run: |
          set -euo pipefail
          E2E_VIEWPORT=desktop npm run test:e2e:public
          E2E_VIEWPORT=mobile npm run test:e2e:public
