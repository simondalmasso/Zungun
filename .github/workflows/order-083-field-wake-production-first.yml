name: Order 083 field wake production first
on:
  push:
    branches: [bootstrap/order-083-production-first]
    paths: [.github/workflows/order-083-field-wake-production-first.yml]
permissions:
  contents: read
env:
  EXPECTED_CANONICAL_HEAD: dc9c893fbbc4a97eddd23aa33a6e82cbbf3d5d73
  ZUNGUN_ORIGIN: https://zungun.simondalmasso44.workers.dev
jobs:
  deploy-proven-field-wake:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ZUNGUN_PILOT_TOKEN: ${{ secrets.ZUNGUN_PILOT_TOKEN }}
      ORDER083_EVIDENCE_DIR: ${{ runner.temp }}/order083-production
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: feat/zungun-full-project-v1
          fetch-depth: 0
          persist-credentials: false
      - name: Fail closed on canonical head
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_CANONICAL_HEAD"
          remote="$(git ls-remote origin refs/heads/feat/zungun-full-project-v1 | cut -f1)"
          test "$remote" = "$EXPECTED_CANONICAL_HEAD"
      - name: Apply exact proven source byte change
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('android/runtime/src/main/java/com/zungun/runtime/link/LinkNetworkWakeRegistry.kt')
          s=p.read_text()
          old='NETWORK_WAKE_WORK,\n            ExistingWorkPolicy.KEEP,\n            OneTimeWorkRequestBuilder<LinkWakeWorker>().build(),'
          new='NETWORK_WAKE_WORK,\n            ExistingWorkPolicy.REPLACE,\n            OneTimeWorkRequestBuilder<LinkWakeWorker>().build(),'
          assert s.count(old)==1, s.count(old)
          p.write_text(s.replace(old,new))
          PY
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "android/runtime/src/main/java/com/zungun/runtime/link/LinkNetworkWakeRegistry.kt"
      - name: Revalidate candidate source
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          bash -n tools/order083/deploy-production.sh
          rm -rf evidence/order083/local
          node tools/order083/generate-manifests.mjs . evidence/order083/local
          cat evidence/order083/local/result.json
      - name: Deploy exact candidate to production first
        run: tools/order083/deploy-production.sh
      - name: Seal production exact identity
        run: |
          set -euo pipefail
          expected=evidence/order083/local/result.json
          curl --fail --silent --show-error "$ZUNGUN_ORIGIN/version" | tee "$RUNNER_TEMP/version.json"
          test "$(jq -r .sourceBundleSha256 "$RUNNER_TEMP/version.json")" = "$(jq -r .sourceBundleSha256 "$expected")"
          test "$(jq -r .staticAssetManifestSha256 "$RUNNER_TEMP/version.json")" = "$(jq -r .staticAssetManifestSha256 "$expected")"
          test "$(jq -r .migrationManifestSha256 "$RUNNER_TEMP/version.json")" = "$(jq -r .migrationManifestSha256 "$expected")"
          printf 'PRODUCTION_FIRST=PASS\nCANONICAL_BASE=%s\nSOURCE_BUNDLE_SHA256=%s\nSTATIC_ASSET_MANIFEST_SHA256=%s\nMIGRATION_MANIFEST_SHA256=%s\n' "$EXPECTED_CANONICAL_HEAD" "$(jq -r .sourceBundleSha256 "$expected")" "$(jq -r .staticAssetManifestSha256 "$expected")" "$(jq -r .migrationManifestSha256 "$expected")" | tee "$RUNNER_TEMP/RESULT"
      - name: Upload production-first evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: order083-field-wake-production-first-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/order083-production
            evidence/order083/local
            ${{ runner.temp }}/version.json
            ${{ runner.temp }}/RESULT
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
