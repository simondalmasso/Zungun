name: Web SMS bridge contract
on:
  pull_request:
    paths:
      - 'cloudflare/public/chat/sms-bridge.js'
      - 'tests/web-sms-bridge.test.js'
      - 'package.json'
      - '.github/workflows/web-sms-bridge.yml'
  push:
    branches:
      - feature/web-sms-bridge
    paths:
      - 'cloudflare/public/chat/sms-bridge.js'
      - 'tests/web-sms-bridge.test.js'
      - 'package.json'
      - '.github/workflows/web-sms-bridge.yml'
jobs:
  sms-bridge-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run test:sms-bridge
