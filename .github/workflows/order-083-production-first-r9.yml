name: Order 083 deterministic not-sent production-first R11

on:
  push:
    branches: [bootstrap/order-083-production-first]
    paths: [.github/workflows/order-083-production-first-r9.yml]

permissions:
  contents: read
  actions: read

env:
  CI: "true"
  NO_COLOR: "1"
  WRANGLER_SEND_METRICS: "false"
  ZUNGUN_ORIGIN: https://zungun.simondalmasso44.workers.dev
  PR_BRANCH: feat/zungun-full-project-v1
  EXPECTED_PR_HEAD: 98e846a5888a1772ea415412db86e67bc4a2e55a

jobs:
  production-first:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ZUNGUN_PILOT_TOKEN: ${{ secrets.ZUNGUN_PILOT_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.PR_BRANCH }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22.16.0
          package-manager-cache: false
      - name: Materialize exact deterministic candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_PR_HEAD"
          test "$(git ls-remote origin "refs/heads/$PR_BRANCH" | awk '{print $1}')" = "$EXPECTED_PR_HEAD"
          files=(
            tools/order083/generate-manifests.mjs
            tools/order083/android-field-recovery-e2e.sh
            android/app/src/main/java/com/zungun/app/ZungunApplication.kt
            android/app/src/androidTest/java/com/zungun/app/Order083FieldRecoveryInstrumentedTest.kt
            android/runtime/src/main/java/com/zungun/runtime/network/ReceiverTransportClient.kt
            android/runtime/src/main/java/com/zungun/runtime/delivery/DeliveryWorker.kt
            android/runtime/src/main/java/com/zungun/runtime/delivery/LinkDeliveryWorker.kt
            android/runtime/src/main/java/com/zungun/runtime/db/LinkDao.kt
          )
          for path in "${files[@]}"; do git show "origin/bootstrap/order-083-production-first:$path" > "$path"; done
          chmod +x tools/order083/android-field-recovery-e2e.sh
          git diff --check
          test "$(git status --porcelain=v1 | wc -l)" -eq 8
          printf '%s\n' "${files[@]}" | sort > "$RUNNER_TEMP/expected"
          git diff --name-only | sort > "$RUNNER_TEMP/actual"
          cmp "$RUNNER_TEMP/expected" "$RUNNER_TEMP/actual"
          grep -Fq "const roots=['.'];" tools/order083/generate-manifests.mjs
          grep -Fq '@Insert(onConflict = OnConflictStrategy.IGNORE) suspend fun plan' android/runtime/src/main/java/com/zungun/runtime/db/LinkDao.kt
          grep -Fq 'persistInterruptedAttemptAsUnknown' android/runtime/src/main/java/com/zungun/runtime/delivery/LinkDeliveryWorker.kt
          grep -Fq 'LinkNetworkWakeRegistry.ensure(this)' android/app/src/main/java/com/zungun/app/ZungunApplication.kt
          grep -Fq 'waitProvenNotSent' android/app/src/androidTest/java/com/zungun/app/Order083FieldRecoveryInstrumentedTest.kt
          grep -Fq 'PROCESS_DEATH_AFTER_PROVEN_NOT_SENT=PROVEN' tools/order083/android-field-recovery-e2e.sh
          grep -Fq 'PROCESS_DEATH_AFTER_UNKNOWN=PROVEN' tools/order083/android-field-recovery-e2e.sh
          grep -Fq '.fieldOperationCount==0 and .fieldEffectCount==0' tools/order083/android-field-recovery-e2e.sh
          grep -Fq '.fieldOperationCount==1 and .fieldEffectCount==1' tools/order083/android-field-recovery-e2e.sh
          ! grep -Fq 'dumpsys connectivity' tools/order083/android-field-recovery-e2e.sh
      - name: Regressions and source identity coverage
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          node --check cloudflare/src/worker.mjs
          node --test cloudflare/test/contracts.test.mjs
          bash -n tools/order083/android-field-recovery-e2e.sh
          node tools/order083/generate-manifests.mjs . "$RUNNER_TEMP/m1"
          node tools/order083/generate-manifests.mjs . "$RUNNER_TEMP/m2"
          cmp "$RUNNER_TEMP/m1/result.json" "$RUNNER_TEMP/m2/result.json"
          grep -Fq 'android/runtime/src/main/java/com/zungun/runtime/db/LinkDao.kt' "$RUNNER_TEMP/m1/SOURCE_MANIFEST.sha256"
          grep -Fq 'packages/' "$RUNNER_TEMP/m1/SOURCE_MANIFEST.sha256"
          grep -Fq 'services/' "$RUNNER_TEMP/m1/SOURCE_MANIFEST.sha256"
          grep -Fq 'tests/' "$RUNNER_TEMP/m1/SOURCE_MANIFEST.sha256"
          cp "$RUNNER_TEMP/m1/result.json" "$RUNNER_TEMP/candidate.json"
          curl --fail --silent --show-error "$ZUNGUN_ORIGIN/version" > "$RUNNER_TEMP/before.json"
          test "$(jq -r .staticAssetManifestSha256 "$RUNNER_TEMP/candidate.json")" = "$(jq -r .staticAssetManifestSha256 "$RUNNER_TEMP/before.json")"
          test "$(jq -r .migrationManifestSha256 "$RUNNER_TEMP/candidate.json")" = "$(jq -r .migrationManifestSha256 "$RUNNER_TEMP/before.json")"
          test "$(jq -r .sourceBundleSha256 "$RUNNER_TEMP/candidate.json")" != "$(jq -r .sourceBundleSha256 "$RUNNER_TEMP/before.json")"
      - name: Install and boot API35 emulator
        shell: bash
        run: |
          set -euo pipefail
          sdkroot="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"; sdkmanager="$sdkroot/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" platform-tools 'platforms;android-35' 'build-tools;35.0.0' emulator 'system-images;android-35;google_apis;x86_64'
          export ANDROID_USER_HOME="$RUNNER_TEMP/android-home" ANDROID_EMULATOR_HOME="$RUNNER_TEMP/android-home" ANDROID_AVD_HOME="$RUNNER_TEMP/android-home/avd"; mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$sdkroot/cmdline-tools/latest/bin/avdmanager" create avd --force -n order083-r11 -k 'system-images;android-35;google_apis;x86_64' --device pixel_6
          sudo chmod 666 /dev/kvm || true
          nohup "$sdkroot/emulator/emulator" -avd order083-r11 -no-window -noaudio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -accel auto > "$RUNNER_TEMP/emulator.log" 2>&1 &
          printf 'ANDROID_SDK_ROOT=%s\nANDROID_HOME=%s\n' "$sdkroot" "$sdkroot" >> "$GITHUB_ENV"
          printf '%s\n' "$sdkroot/platform-tools" >> "$GITHUB_PATH"
          timeout 180s "$sdkroot/platform-tools/adb" wait-for-device
          for _ in $(seq 1 120); do [[ "$("$sdkroot/platform-tools/adb" shell getprop sys.boot_completed 2>/dev/null|tr -d '\r')" == 1 ]] && exit 0; sleep 2; done
          cat "$RUNNER_TEMP/emulator.log"; exit 1
      - name: Gate44 Field deterministic production-first proof
        env:
          ORDER083_FIELD_RECOVERY_EVIDENCE: ${{ runner.temp }}/field-predeploy
        run: tools/order083/android-field-recovery-e2e.sh
      - name: Deploy exact proven candidate and verify live
        env:
          ORDER083_EVIDENCE_DIR: ${{ runner.temp }}/production
        run: |
          set -euo pipefail
          bash tools/order083/deploy-production.sh | tee "$RUNNER_TEMP/deploy.txt"
          curl --fail --silent --show-error "$ZUNGUN_ORIGIN/version" > "$RUNNER_TEMP/after.json"
          for k in sourceBundleSha256 staticAssetManifestSha256 migrationManifestSha256; do test "$(jq -r .$k "$RUNNER_TEMP/candidate.json")" = "$(jq -r .$k "$RUNNER_TEMP/after.json")"; done
          node tools/order083/live-e2e.mjs "$RUNNER_TEMP/live"
          test "$(git ls-remote origin "refs/heads/$PR_BRANCH" | awk '{print $1}')" = "$EXPECTED_PR_HEAD"
      - name: Seal
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/seal"
          cp "$RUNNER_TEMP/candidate.json" "$RUNNER_TEMP/seal/candidate.json"
          cp "$RUNNER_TEMP/field-predeploy/result.json" "$RUNNER_TEMP/seal/field-result.json"
          printf 'ORDER=ORDER-083\nPRODUCTION_FIRST=YES\nFULL_SOURCE_IDENTITY=PASS\nGATE44_FIELD=PASS\nB_NOT_SENT_BEFORE_PROCESS_DEATH=PASS\nB_BACKEND_ZERO_BEFORE_RECOVERY=PASS\nB_BACKEND_EXACTLY_ONE_AFTER_RECOVERY=PASS\nC_NOT_SENT_BEFORE_FAULT=PASS\nC_BACKEND_ZERO_BEFORE_FAULT=PASS\nC_UNKNOWN_DURABLE=PASS\nPROCESS_DEATH_AFTER_UNKNOWN=PASS\nC_RECONCILIATION_BEFORE_RETRY=PASS\nC_BACKEND_EXACTLY_ONE=PASS\nDETERMINISTIC_PLAN_PERSISTENCE=IDEMPOTENT\nLIVE_IDENTITY=PASS\nPR16_ADVANCED=NO\nMERGE=NO\nORDER082_STARTED=NO\nORDER084_STARTED=NO\n' > "$RUNNER_TEMP/seal/RESULT"
          find "$RUNNER_TEMP/seal" -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/seal/MANIFEST.sha256"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: order083-production-first-r11-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/candidate.json
            ${{ runner.temp }}/before.json
            ${{ runner.temp }}/after.json
            ${{ runner.temp }}/deploy.txt
            ${{ runner.temp }}/m1
            ${{ runner.temp }}/field-predeploy
            ${{ runner.temp }}/production
            ${{ runner.temp }}/live
            ${{ runner.temp }}/emulator.log
            ${{ runner.temp }}/seal
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
