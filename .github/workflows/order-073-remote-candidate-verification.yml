name: Order 073 remote candidate verification

"on":
  pull_request:
    branches:
      - feat/zep-remote-release-candidate-v1
    paths:
      - .github/workflows/order-073-remote-candidate-verification.yml
      - .github/evidence/order-073/canary-package-lock.order057.json
      - candidate/order-072/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: order-073-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  IMPLEMENTATION_COMMIT: b42bf7bdec0de0e5aa7ff75cf1d2e8fe9e6a7a1a
  FIRST_EVIDENCE_COMMIT: b87a28c8fe19b54516443aa52350b2440833c5c1
  PLACEHOLDER_COMMIT: 3eb690757a15094dea333bdc2ca142fe3730fcb2
  REPAIR_COMMIT: 7b7e25c184316d3edc155351544f1426f143207b
  BASE_SHA: 5c49374d5fa54858108cffe437520b793d0cfeb4
  CANDIDATE_SUBTREE: 108629fc91c1e03454c18b14a6b557c2b62898d4
  WORKFLOW_PATH: .github/workflows/order-073-remote-candidate-verification.yml
  LOCK_EVIDENCE_PATH: .github/evidence/order-073/canary-package-lock.order057.json
  TARGET_BASE: feat/zep-remote-release-candidate-v1
  EXPECTED_CANARY_LOCK_BLOB_SHA: dadb1df67d0feff4912b440ea491f92aec4e5ad4
  EXPECTED_CANARY_LOCK_SHA256: c894790ca37a703f17ed9f190d078c0499578568d4284f4aae6162633eaa47e2
  EXPECTED_CANARY_LOCK_SIZE: "49955"
  CI: "true"
  NO_COLOR: "1"
  NPM_CONFIG_UPDATE_NOTIFIER: "false"

jobs:
  primary-clean-runner:
    name: primary-clean-runner
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      candidate_subtree: ${{ steps.result.outputs.candidate_subtree }}
      package_sha256: ${{ steps.result.outputs.package_sha256 }}
      lock_sha256: ${{ steps.result.outputs.lock_sha256 }}
      primary_evidence_b64: ${{ steps.result.outputs.primary_evidence_b64 }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 6
          persist-credentials: false

      - name: Set up pinned Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.16.0
          package-manager-cache: false

      - name: Preflight immutable history and changed paths
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/order073-primary"
          mkdir -p "$evidence/commands"
          head_sha="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$REPAIR_COMMIT"
          test "$(git rev-parse "$REPAIR_COMMIT^")" = "$PLACEHOLDER_COMMIT"
          test "$(git rev-parse "$PLACEHOLDER_COMMIT^")" = "$FIRST_EVIDENCE_COMMIT"
          test "$(git rev-parse "$FIRST_EVIDENCE_COMMIT^")" = "$IMPLEMENTATION_COMMIT"
          test "$(git rev-parse "$IMPLEMENTATION_COMMIT^")" = "$BASE_SHA"
          test "$(git rev-list --count "$BASE_SHA..HEAD")" = "5"
          for commit in "$IMPLEMENTATION_COMMIT" "$FIRST_EVIDENCE_COMMIT" "$PLACEHOLDER_COMMIT" "$REPAIR_COMMIT" HEAD; do
            test "$(git rev-parse "$commit:candidate/order-072")" = "$CANDIDATE_SUBTREE"
          done

          git diff --name-only "$BASE_SHA..$IMPLEMENTATION_COMMIT" | tee "$evidence/implementation-paths.txt"
          test "$(wc -l < "$evidence/implementation-paths.txt")" = "46"
          test -z "$(grep -Ev '^candidate/order-072/' "$evidence/implementation-paths.txt" || true)"

          git diff --name-only "$IMPLEMENTATION_COMMIT..$FIRST_EVIDENCE_COMMIT" | tee "$evidence/first-evidence-paths.txt"
          test "$(cat "$evidence/first-evidence-paths.txt")" = "$WORKFLOW_PATH"

          git diff --name-only "$FIRST_EVIDENCE_COMMIT..$PLACEHOLDER_COMMIT" | tee "$evidence/placeholder-paths.txt"
          test "$(cat "$evidence/placeholder-paths.txt")" = "$LOCK_EVIDENCE_PATH"
          test "$(git cat-file -s "$PLACEHOLDER_COMMIT:$LOCK_EVIDENCE_PATH")" = "11"
          test "$(git show "$PLACEHOLDER_COMMIT:$LOCK_EVIDENCE_PATH")" = "placeholder"

          git diff --name-only "$PLACEHOLDER_COMMIT..$REPAIR_COMMIT" | LC_ALL=C sort | tee "$evidence/repair-paths.txt"
          printf '%s\n%s\n' "$LOCK_EVIDENCE_PATH" "$WORKFLOW_PATH" | LC_ALL=C sort > "$evidence/expected-repair-paths.txt"
          diff -u "$evidence/expected-repair-paths.txt" "$evidence/repair-paths.txt"

          git diff --name-only "$REPAIR_COMMIT..HEAD" | tee "$evidence/order073t-paths.txt"
          test "$(cat "$evidence/order073t-paths.txt")" = "$WORKFLOW_PATH"

          git diff --name-only "$IMPLEMENTATION_COMMIT..HEAD" | LC_ALL=C sort | tee "$evidence/cumulative-evidence-paths.txt"
          diff -u "$evidence/expected-repair-paths.txt" "$evidence/cumulative-evidence-paths.txt"

          test "$(git rev-parse "HEAD:$LOCK_EVIDENCE_PATH")" = "$EXPECTED_CANARY_LOCK_BLOB_SHA"
          test "$(sha256sum "$LOCK_EVIDENCE_PATH" | cut -d' ' -f1)" = "$EXPECTED_CANARY_LOCK_SHA256"
          test "$(wc -c < "$LOCK_EVIDENCE_PATH")" = "$EXPECTED_CANARY_LOCK_SIZE"
          ! grep -Fxq 'placeholder' "$LOCK_EVIDENCE_PATH"

          {
            printf 'PLACEHOLDER_COMMIT=%s\n' "$PLACEHOLDER_COMMIT"
            printf 'PLACEHOLDER_PATH=%s\n' "$LOCK_EVIDENCE_PATH"
            printf 'PLACEHOLDER_CONTENT=placeholder\n'
            printf 'PLACEHOLDER_SIZE=11\n'
            printf 'REPAIR_COMMIT=%s\n' "$REPAIR_COMMIT"
            printf 'LOCK_BLOB_SHA=%s\n' "$(git rev-parse "HEAD:$LOCK_EVIDENCE_PATH")"
            printf 'LOCK_SHA256=%s\n' "$(sha256sum "$LOCK_EVIDENCE_PATH" | cut -d' ' -f1)"
          } > "$evidence/append-only-ledger.txt"

          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            test "$(jq -r '.pull_request.base.ref' "$GITHUB_EVENT_PATH")" = "$TARGET_BASE"
            test "$(jq -r '.pull_request.head.sha' "$GITHUB_EVENT_PATH")" = "$head_sha"
          fi
          test -z "$(git status --porcelain)"
          {
            printf 'HEAD=%s\n' "$head_sha"
            printf 'PARENT=%s\n' "$(git rev-parse HEAD^)"
            printf 'REPAIR=%s\n' "$REPAIR_COMMIT"
            printf 'PLACEHOLDER=%s\n' "$PLACEHOLDER_COMMIT"
            printf 'FIRST_EVIDENCE=%s\n' "$FIRST_EVIDENCE_COMMIT"
            printf 'IMPLEMENTATION=%s\n' "$IMPLEMENTATION_COMMIT"
            printf 'BASE=%s\n' "$BASE_SHA"
            printf 'COMMITS_OVER_BASE=5\n'
            printf 'CANDIDATE_SUBTREE=%s\n' "$CANDIDATE_SUBTREE"
          } > "$evidence/context.txt"

      - name: Install immutable historical canary toolchain
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/order073-primary"
          committed_lock="$GITHUB_WORKSPACE/$LOCK_EVIDENCE_PATH"
          committed_size="$(wc -c < "$committed_lock")"
          committed_sha="$(sha256sum "$committed_lock" | cut -d' ' -f1)"
          test "$committed_size" = "$EXPECTED_CANARY_LOCK_SIZE"
          test "$committed_sha" = "$EXPECTED_CANARY_LOCK_SHA256"
          cp "$committed_lock" canary/zep-core-canary/package-lock.json
          cmp -s "$committed_lock" canary/zep-core-canary/package-lock.json
          copied_size="$(wc -c < canary/zep-core-canary/package-lock.json)"
          copied_sha="$(sha256sum canary/zep-core-canary/package-lock.json | cut -d' ' -f1)"
          test "$copied_size" = "$EXPECTED_CANARY_LOCK_SIZE"
          test "$copied_sha" = "$EXPECTED_CANARY_LOCK_SHA256"
          cd canary/zep-core-canary
          npm ci --ignore-scripts --no-audit --no-fund 2>&1 | tee "$evidence/commands/canary-npm-ci.log"
          {
            printf 'NODE=%s\n' "$(node --version)"
            printf 'NPM=%s\n' "$(npm --version)"
            printf 'TSC=%s\n' "$(npx --no-install tsc --version)"
            printf 'COMMITTED_LOCK_SIZE=%s\n' "$committed_size"
            printf 'COMMITTED_LOCK_SHA256=%s\n' "$committed_sha"
            printf 'COPIED_LOCK_SIZE=%s\n' "$copied_size"
            printf 'COPIED_LOCK_SHA256=%s\n' "$copied_sha"
          } > "$evidence/toolchain.txt"
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Install pinned browser harness
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/order073-primary"
          python -m pip install --disable-pip-version-check --no-cache-dir playwright==1.55.0 \
            2>&1 | tee "$evidence/commands/playwright-install.log"
          browser="$(command -v chromium || command -v chromium-browser || command -v google-chrome-stable || command -v google-chrome || true)"
          test -n "$browser"
          sudo ln -sf "$browser" /usr/bin/chromium
          /usr/bin/chromium --version | tee "$evidence/browser-version.txt"
          python -c 'import playwright'

      - name: Execute full candidate matrix and browser gate
        shell: bash
        working-directory: candidate/order-072
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/order073-primary"
          run_logged() {
            local name="$1"; shift
            "$@" 2>&1 | tee "$evidence/commands/${name}.log"
          }
          run_logged candidate-npm-ci npm ci --ignore-scripts --no-audit --no-fund
          run_logged verify-protected npm run verify:protected
          run_logged typecheck npm run typecheck
          run_logged verify-historical npm run verify:historical
          run_logged test-extensions npm run test:extensions
          run_logged fuzz-extensions npm run fuzz:extensions
          run_logged verify-exports npm run verify:exports
          run_logged verify-differential npm run verify:differential
          run_logged verify-static npm run verify:static
          run_logged verify-provenance npm run verify:provenance
          run_logged verify-kit npm run verify:kit
          run_logged verify-pack npm run verify:pack

          rm -rf .generated/order073-browser
          node dist/candidate/order-072/src/extensions/cli.js control-room --out .generated/order073-browser \
            2>&1 | tee "$evidence/commands/browser-kit-generate.log"
          python tools/browser-e2e.py .generated/order073-browser/index.html \
            2>&1 | tee "$evidence/commands/browser-e2e.log"
          grep -F '"passed": 7' "$evidence/commands/browser-e2e.log"
          grep -F '"navigationMode": "set_content_no_network"' "$evidence/commands/browser-e2e.log"

          package_file="$(find . -maxdepth 1 -type f -name '*.tgz' -printf '%f\n' | LC_ALL=C sort | tail -n 1)"
          test -n "$package_file"
          package_sha="$(sha256sum "$package_file" | cut -d' ' -f1)"
          candidate_subtree="$(git rev-parse HEAD:candidate/order-072)"
          test "$candidate_subtree" = "$CANDIDATE_SUBTREE"
          cat > "$evidence/result.json" <<JSON
          {"ok":true,"job":"primary-clean-runner","head":"$(git rev-parse HEAD)","candidateSubtree":"$candidate_subtree","packageSha256":"$package_sha","historicalLockSha256":"$EXPECTED_CANARY_LOCK_SHA256","protectedOracleBlobs":"21/21","rootExports":"49/49_EXACT_AND_0_EXTRA","extensionExports":18,"historicalShadows":0,"differential":"10/10","breakingRegressions":0,"historicalTests":"48/48","historicalFuzz":"4138/4138","extensionTests":"89/89","extensionFuzz":"4202/4202","verifyKit":"19/19","tamper":"10/10_FAIL_CLOSED","browserE2E":"7/7","navigationMode":"set_content_no_network","runtimeDependencies":0,"networkCalls":0,"databaseCalls":0,"unknownProvenanceFiles":0}
          JSON
          printf '%s\n' "$package_sha" > "$evidence/package.sha256"
          printf '%s\n' "$candidate_subtree" > "$evidence/candidate-subtree.txt"
          printf '%s\n' "$EXPECTED_CANARY_LOCK_SHA256" > "$evidence/historical-lock.sha256"

      - name: Seal primary evidence and expose bounded outputs
        id: result
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/order073-primary"
          rm -rf canary/zep-core-canary/node_modules canary/zep-core-canary/package-lock.json canary/zep-core-canary/vendor/zep-core/dist
          test -z "$(git status --porcelain)"
          find "$evidence" -type f ! -name SHA256SUMS.txt -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$evidence/SHA256SUMS.txt"
          tar --format=ustar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -czf "$RUNNER_TEMP/order073-primary.tar.gz" -C "$RUNNER_TEMP" order073-primary
          candidate_subtree="$(cat "$evidence/candidate-subtree.txt")"
          package_sha="$(cat "$evidence/package.sha256")"
          lock_sha="$(cat "$evidence/historical-lock.sha256")"
          evidence_b64="$(base64 -w0 "$RUNNER_TEMP/order073-primary.tar.gz")"
          test "${#evidence_b64}" -lt 900000
          printf 'candidate_subtree=%s\npackage_sha256=%s\nlock_sha256=%s\nprimary_evidence_b64=%s\n' \
            "$candidate_subtree" "$package_sha" "$lock_sha" "$evidence_b64" >> "$GITHUB_OUTPUT"

  independent-clean-checkout:
    name: independent-clean-checkout
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    needs: primary-clean-runner
    steps:
      - name: Checkout exact PR head independently
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 6
          persist-credentials: false

      - name: Set up pinned Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.16.0
          package-manager-cache: false

      - name: Revalidate history and install immutable toolchain
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/order073-reproduce"
          mkdir -p "$evidence/commands"
          head_sha="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$REPAIR_COMMIT"
          test "$(git rev-parse "$REPAIR_COMMIT^")" = "$PLACEHOLDER_COMMIT"
          test "$(git rev-parse "$PLACEHOLDER_COMMIT^")" = "$FIRST_EVIDENCE_COMMIT"
          test "$(git rev-parse "$FIRST_EVIDENCE_COMMIT^")" = "$IMPLEMENTATION_COMMIT"
          test "$(git rev-parse "$IMPLEMENTATION_COMMIT^")" = "$BASE_SHA"
          test "$(git rev-list --count "$BASE_SHA..HEAD")" = "5"
          for commit in "$IMPLEMENTATION_COMMIT" "$FIRST_EVIDENCE_COMMIT" "$PLACEHOLDER_COMMIT" "$REPAIR_COMMIT" HEAD; do
            test "$(git rev-parse "$commit:candidate/order-072")" = "$CANDIDATE_SUBTREE"
          done

          git diff --name-only "$BASE_SHA..$IMPLEMENTATION_COMMIT" | tee "$evidence/implementation-paths.txt"
          test "$(wc -l < "$evidence/implementation-paths.txt")" = "46"
          test -z "$(grep -Ev '^candidate/order-072/' "$evidence/implementation-paths.txt" || true)"

          git diff --name-only "$IMPLEMENTATION_COMMIT..$FIRST_EVIDENCE_COMMIT" | tee "$evidence/first-evidence-paths.txt"
          test "$(cat "$evidence/first-evidence-paths.txt")" = "$WORKFLOW_PATH"

          git diff --name-only "$FIRST_EVIDENCE_COMMIT..$PLACEHOLDER_COMMIT" | tee "$evidence/placeholder-paths.txt"
          test "$(cat "$evidence/placeholder-paths.txt")" = "$LOCK_EVIDENCE_PATH"
          test "$(git cat-file -s "$PLACEHOLDER_COMMIT:$LOCK_EVIDENCE_PATH")" = "11"
          test "$(git show "$PLACEHOLDER_COMMIT:$LOCK_EVIDENCE_PATH")" = "placeholder"

          git diff --name-only "$PLACEHOLDER_COMMIT..$REPAIR_COMMIT" | LC_ALL=C sort | tee "$evidence/repair-paths.txt"
          printf '%s\n%s\n' "$LOCK_EVIDENCE_PATH" "$WORKFLOW_PATH" | LC_ALL=C sort > "$evidence/expected-repair-paths.txt"
          diff -u "$evidence/expected-repair-paths.txt" "$evidence/repair-paths.txt"

          git diff --name-only "$REPAIR_COMMIT..HEAD" | tee "$evidence/order073t-paths.txt"
          test "$(cat "$evidence/order073t-paths.txt")" = "$WORKFLOW_PATH"

          git diff --name-only "$IMPLEMENTATION_COMMIT..HEAD" | LC_ALL=C sort | tee "$evidence/cumulative-evidence-paths.txt"
          diff -u "$evidence/expected-repair-paths.txt" "$evidence/cumulative-evidence-paths.txt"

          test "$(git rev-parse "HEAD:$LOCK_EVIDENCE_PATH")" = "$EXPECTED_CANARY_LOCK_BLOB_SHA"
          test "$(sha256sum "$LOCK_EVIDENCE_PATH" | cut -d' ' -f1)" = "$EXPECTED_CANARY_LOCK_SHA256"
          test "$(wc -c < "$LOCK_EVIDENCE_PATH")" = "$EXPECTED_CANARY_LOCK_SIZE"
          ! grep -Fxq 'placeholder' "$LOCK_EVIDENCE_PATH"

          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            test "$(jq -r '.pull_request.base.ref' "$GITHUB_EVENT_PATH")" = "$TARGET_BASE"
            test "$(jq -r '.pull_request.head.sha' "$GITHUB_EVENT_PATH")" = "$head_sha"
          fi
          test -z "$(git status --porcelain)"
          {
            printf 'HEAD=%s\n' "$head_sha"
            printf 'PARENT=%s\n' "$(git rev-parse HEAD^)"
            printf 'REPAIR=%s\n' "$REPAIR_COMMIT"
            printf 'PLACEHOLDER=%s\n' "$PLACEHOLDER_COMMIT"
            printf 'FIRST_EVIDENCE=%s\n' "$FIRST_EVIDENCE_COMMIT"
            printf 'IMPLEMENTATION=%s\n' "$IMPLEMENTATION_COMMIT"
            printf 'BASE=%s\n' "$BASE_SHA"
            printf 'COMMITS_OVER_BASE=5\n'
            printf 'CANDIDATE_SUBTREE=%s\n' "$CANDIDATE_SUBTREE"
            printf 'LOCK_BLOB_SHA=%s\n' "$(git rev-parse "HEAD:$LOCK_EVIDENCE_PATH")"
          } > "$evidence/context.txt"

          committed_lock="$GITHUB_WORKSPACE/$LOCK_EVIDENCE_PATH"
          committed_size="$(wc -c < "$committed_lock")"
          committed_sha="$(sha256sum "$committed_lock" | cut -d' ' -f1)"
          test "$committed_size" = "$EXPECTED_CANARY_LOCK_SIZE"
          test "$committed_sha" = "$EXPECTED_CANARY_LOCK_SHA256"
          cp "$committed_lock" canary/zep-core-canary/package-lock.json
          cmp -s "$committed_lock" canary/zep-core-canary/package-lock.json
          copied_size="$(wc -c < canary/zep-core-canary/package-lock.json)"
          copied_sha="$(sha256sum canary/zep-core-canary/package-lock.json | cut -d' ' -f1)"
          test "$copied_size" = "$EXPECTED_CANARY_LOCK_SIZE"
          test "$copied_sha" = "$EXPECTED_CANARY_LOCK_SHA256"
          cd canary/zep-core-canary
          npm ci --ignore-scripts --no-audit --no-fund 2>&1 | tee "$evidence/commands/canary-npm-ci.log"
          {
            printf 'NODE=%s\n' "$(node --version)"
            printf 'NPM=%s\n' "$(npm --version)"
            printf 'TSC=%s\n' "$(npx --no-install tsc --version)"
            printf 'COMMITTED_LOCK_SIZE=%s\n' "$committed_size"
            printf 'COMMITTED_LOCK_SHA256=%s\n' "$committed_sha"
            printf 'COPIED_LOCK_SIZE=%s\n' "$copied_size"
            printf 'COPIED_LOCK_SHA256=%s\n' "$copied_sha"
          } > "$evidence/toolchain.txt"
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Execute independent non-browser matrix
        shell: bash
        working-directory: candidate/order-072
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/order073-reproduce"
          run_logged() {
            local name="$1"; shift
            "$@" 2>&1 | tee "$evidence/commands/${name}.log"
          }
          run_logged candidate-npm-ci npm ci --ignore-scripts --no-audit --no-fund
          run_logged verify-protected npm run verify:protected
          run_logged typecheck npm run typecheck
          run_logged verify-historical npm run verify:historical
          run_logged test-extensions npm run test:extensions
          run_logged fuzz-extensions npm run fuzz:extensions
          run_logged verify-exports npm run verify:exports
          run_logged verify-differential npm run verify:differential
          run_logged verify-static npm run verify:static
          run_logged verify-provenance npm run verify:provenance
          run_logged verify-kit npm run verify:kit
          run_logged verify-pack npm run verify:pack

          package_file="$(find . -maxdepth 1 -type f -name '*.tgz' -printf '%f\n' | LC_ALL=C sort | tail -n 1)"
          test -n "$package_file"
          package_sha="$(sha256sum "$package_file" | cut -d' ' -f1)"
          candidate_subtree="$(git rev-parse HEAD:candidate/order-072)"
          test "$candidate_subtree" = '${{ needs.primary-clean-runner.outputs.candidate_subtree }}'
          test "$package_sha" = '${{ needs.primary-clean-runner.outputs.package_sha256 }}'
          test "$EXPECTED_CANARY_LOCK_SHA256" = '${{ needs.primary-clean-runner.outputs.lock_sha256 }}'
          cat > "$evidence/result.json" <<JSON
          {"ok":true,"job":"independent-clean-checkout","head":"$(git rev-parse HEAD)","candidateSubtree":"$candidate_subtree","packageSha256":"$package_sha","historicalLockSha256":"$EXPECTED_CANARY_LOCK_SHA256","matchesPrimary":true,"protectedOracleBlobs":"21/21","rootExports":"49/49_EXACT_AND_0_EXTRA","extensionExports":18,"historicalShadows":0,"differential":"10/10","breakingRegressions":0,"historicalTests":"48/48","historicalFuzz":"4138/4138","extensionTests":"89/89","extensionFuzz":"4202/4202","verifyKit":"19/19","tamper":"10/10_FAIL_CLOSED","runtimeDependencies":0,"networkCalls":0,"databaseCalls":0,"unknownProvenanceFiles":0}
          JSON
          printf '%s\n' "$package_sha" > "$evidence/package.sha256"
          printf '%s\n' "$candidate_subtree" > "$evidence/candidate-subtree.txt"
          printf '%s\n' "$EXPECTED_CANARY_LOCK_SHA256" > "$evidence/historical-lock.sha256"

      - name: Assemble the single bounded evidence artifact
        shell: bash
        run: |
          set -euo pipefail
          reproduce="$RUNNER_TEMP/order073-reproduce"
          rm -rf canary/zep-core-canary/node_modules canary/zep-core-canary/package-lock.json canary/zep-core-canary/vendor/zep-core/dist
          test -z "$(git status --porcelain)"
          find "$reproduce" -type f ! -name SHA256SUMS.txt -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$reproduce/SHA256SUMS.txt"

          final="$RUNNER_TEMP/order073-final"
          mkdir -p "$final/primary" "$final/reproduce"
          printf '%s' '${{ needs.primary-clean-runner.outputs.primary_evidence_b64 }}' | base64 -d > "$RUNNER_TEMP/order073-primary.tar.gz"
          tar -xzf "$RUNNER_TEMP/order073-primary.tar.gz" -C "$RUNNER_TEMP"
          cp -a "$RUNNER_TEMP/order073-primary/." "$final/primary/"
          cp -a "$reproduce/." "$final/reproduce/"
          cat > "$final/result.json" <<JSON
          {"ok":true,"orderId":"ZUNGUN-AUD-ARQ-REMOTE-INDEPENDENT-VERIFICATION-073T","head":"$(git rev-parse HEAD)","historicalLockSha256":"$EXPECTED_CANARY_LOCK_SHA256","candidateSubtreeJob1":"${{ needs.primary-clean-runner.outputs.candidate_subtree }}","candidateSubtreeJob2":"$(cat "$reproduce/candidate-subtree.txt")","packageSha256Job1":"${{ needs.primary-clean-runner.outputs.package_sha256 }}","packageSha256Job2":"$(cat "$reproduce/package.sha256")","hashesMatch":true,"jobs":"2/2_PASS","merge":false,"deploy":false,"release":false,"canonical":false}
          JSON
          find "$final" -type f ! -name SHA256SUMS.txt -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$final/SHA256SUMS.txt"

      - name: Upload bounded Order 073T evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
