name: GAOS LEAN baseline

"on":
  push:
    branches:
      - feat/gaos-lean-product-baseline-v1
      - feat/zep-test-loopback-transport-v1
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: gaos-lean-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: "true"
  NO_COLOR: "1"
  WRANGLER_SEND_METRICS: "false"
  EXPECTED_LOCK_SHA256: c894790ca37a703f17ed9f190d078c0499578568d4284f4aae6162633eaa47e2

jobs:
  control-plane:
    name: control-plane-validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up pinned Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.16.0
          package-manager-cache: false
      - name: Enforce mission scope
        shell: bash
        run: |
          set -euo pipefail
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          case "$branch" in
            feat/gaos-lean-product-baseline-v1)
              base=5c49374d5fa54858108cffe437520b793d0cfeb4
              scope=baseline
              ;;
            feat/zep-test-loopback-transport-v1)
              base=940c2dabe81cccb8c9d5a3a140c61b0a8f2d499a
              scope=loopback060
              ;;
            *) echo "UNSUPPORTED_BRANCH=$branch" >&2; exit 1 ;;
          esac
          git cat-file -e "$base^{commit}"
          test "$(git merge-base "$base" HEAD)" = "$base"
          git diff --check "$base..HEAD"
          mapfile -t changed < <(git diff --name-only "$base..HEAD")
          test "${#changed[@]}" -gt 0
          for p in "${changed[@]}"; do
            if [ "$scope" = baseline ]; then
              case "$p" in
                ops/*|README.md|docs/*|tools/*|.github/workflows/*|evidence/order057/*) ;;
                *) echo "OUT_OF_SCOPE=$p" >&2; exit 1 ;;
              esac
            else
              case "$p" in
                ops/CURRENT.json|ops/EVENTS.ndjson|ops/evidence/ZUNGUN-060-CP001.json|tools/verify-gaos-lean.mjs|.github/workflows/gaos-lean-baseline.yml|canary/zep-core-canary/src/*|canary/zep-core-canary/test/*|canary/zep-core-canary/tools/*|canary/zep-core-canary/package.json|canary/zep-core-canary/package-lock.json) ;;
                *) echo "OUT_OF_SCOPE=$p" >&2; exit 1 ;;
              esac
            fi
          done
      - name: Validate GAOS LEAN
        run: node tools/verify-gaos-lean.mjs .

  runtime-regression:
    name: runtime-regression
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: canary/zep-core-canary
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up pinned Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.16.0
          package-manager-cache: false
      - name: Install exact dependencies
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          test "$(sha256sum package-lock.json | cut -d' ' -f1)" = "$EXPECTED_LOCK_SHA256"
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Canary, loopback vertical and core regression
        run: |
          set -euo pipefail
          npm run typecheck
          npm test
          npm run fuzz
          rm -rf vendor/zep-core/dist
          npx --no-install tsc -p vendor/zep-core/tsconfig.json --noEmit
          npx --no-install tsc -p vendor/zep-core/tsconfig.json
          node --test vendor/zep-core/dist/test/adversarial.test.js vendor/zep-core/dist/test/properties.test.js vendor/zep-core/dist/test/semantic-vectors.test.js
          node vendor/zep-core/tools/fuzz-public-boundaries.mjs
      - name: Wrangler dry-run only
        run: |
          set -euo pipefail
          rm -rf .wrangler dist-gaos-lean worker-configuration.d.ts
          npm run wrangler:types
          npx --no-install wrangler deploy --dry-run --outdir dist-gaos-lean --metafile dist-gaos-lean/bundle-meta.json 2>&1 | tee /tmp/wrangler-gaos-lean.log
          test -s dist-gaos-lean/worker.js
          if grep -Eiq '(Successfully published|Successfully deployed|Uploaded .* Worker|workers\.dev)' /tmp/wrangler-gaos-lean.log; then exit 1; fi
          if find ../.. -path '*/.wrangler/deploy/config.json' -print -quit | grep -q .; then exit 1; fi

  gate:
    name: baseline-gate
    needs: [control-plane, runtime-regression]
    runs-on: ubuntu-24.04
    steps:
      - name: Confirm bounded workset
        shell: bash
        run: |
          set -euo pipefail
          printf 'HEAD=%s\nCONTROL_PLANE=PASS\nTYPECHECK=PASS\nUNIT_AND_E2E_TESTS=PASS\nREGRESSION=PASS\nFUZZ=PASS\nWRANGLER_DRY_RUN=PASS\nCLOUDFLARE_WRITE=0\nDEPLOY=0\nRELEASE=0\nPRODUCTION_CHANGE=0\n' "$GITHUB_SHA"
