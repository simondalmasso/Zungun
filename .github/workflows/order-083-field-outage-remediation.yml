name: Order 083 application-traffic outage production-first R5

on:
  push:
    branches: [bootstrap/order-083-production-first]
    paths: [.github/workflows/order-083-field-outage-remediation.yml]

permissions:
  contents: read
  actions: read

env:
  CI: "true"
  NO_COLOR: "1"
  WRANGLER_SEND_METRICS: "false"
  ZUNGUN_ORIGIN: https://zungun.simondalmasso44.workers.dev
  PR_BRANCH: feat/zungun-full-project-v1
  EXPECTED_PR_HEAD: 98e846a5888a1772ea415412db86e67bc4a2e55a

jobs:
  remediate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ZUNGUN_PILOT_TOKEN: ${{ secrets.ZUNGUN_PILOT_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.PR_BRANCH }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22.16.0
          package-manager-cache: false
      - name: Exact PR checkpoint and candidate extraction
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_PR_HEAD"
          test "$(git ls-remote origin "refs/heads/$PR_BRANCH" | awk '{print $1}')" = "$EXPECTED_PR_HEAD"
          test -n "$CLOUDFLARE_ACCOUNT_ID"; test -n "$CLOUDFLARE_API_TOKEN"; test -n "$ZUNGUN_PILOT_TOKEN"
          for path in \
            tools/order083/android-field-recovery-e2e.sh \
            android/app/src/androidTest/java/com/zungun/app/Order083FieldRecoveryInstrumentedTest.kt \
            android/runtime/src/main/java/com/zungun/runtime/network/ReceiverTransportClient.kt \
            android/runtime/src/main/java/com/zungun/runtime/delivery/DeliveryWorker.kt; do
            git show "origin/bootstrap/order-083-production-first:$path" > "$path"
          done
          chmod +x tools/order083/android-field-recovery-e2e.sh
          git diff --check
          test "$(git status --porcelain=v1 | wc -l)" -eq 4
          printf '%s\n' \
            android/app/src/androidTest/java/com/zungun/app/Order083FieldRecoveryInstrumentedTest.kt \
            android/runtime/src/main/java/com/zungun/runtime/delivery/DeliveryWorker.kt \
            android/runtime/src/main/java/com/zungun/runtime/network/ReceiverTransportClient.kt \
            tools/order083/android-field-recovery-e2e.sh | sort > "$RUNNER_TEMP/expected-diff"
          git diff --name-only | sort > "$RUNNER_TEMP/actual-diff"
          cmp "$RUNNER_TEMP/expected-diff" "$RUNNER_TEMP/actual-diff"
          grep -Fq 'phaseTrafficProbeOffline' android/app/src/androidTest/java/com/zungun/app/Order083FieldRecoveryInstrumentedTest.kt
          grep -Fq '@Test fun phase6ObserveDurableUnknown(){runBlocking' android/app/src/androidTest/java/com/zungun/app/Order083FieldRecoveryInstrumentedTest.kt
          grep -Fq '@Test fun phase7VerifyUnknownThenReconciled(){runBlocking' android/app/src/androidTest/java/com/zungun/app/Order083FieldRecoveryInstrumentedTest.kt
          grep -Fq 'assertEquals("UNKNOWN",Zungun.status(context,op)!!.semanticState)' android/app/src/androidTest/java/com/zungun/app/Order083FieldRecoveryInstrumentedTest.kt
          grep -Fq 'APPLICATION_TRAFFIC_UNEXPECTED_HTTP_RESPONSE' android/app/src/androidTest/java/com/zungun/app/Order083FieldRecoveryInstrumentedTest.kt
          grep -Fq 'connectTimeout=3000' android/app/src/androidTest/java/com/zungun/app/Order083FieldRecoveryInstrumentedTest.kt
          grep -Fq 'RetryableNotSent' android/runtime/src/main/java/com/zungun/runtime/network/ReceiverTransportClient.kt
          grep -Fq 'catch (error: ConnectException)' android/runtime/src/main/java/com/zungun/runtime/network/ReceiverTransportClient.kt
          grep -Fq 'TRANSPORT_NOT_SENT' android/runtime/src/main/java/com/zungun/runtime/delivery/DeliveryWorker.kt
          grep -Fq 'OperationState.QUEUED.name' android/runtime/src/main/java/com/zungun/runtime/delivery/DeliveryWorker.kt
          grep -Fq 'run phase6ObserveDurableUnknown;adb shell am force-stop com.zungun.app' tools/order083/android-field-recovery-e2e.sh
          grep -Fq 'PROCESS_DEATH_AFTER_UNKNOWN=PROVEN' tools/order083/android-field-recovery-e2e.sh
          grep -Fq 'adb root' tools/order083/android-field-recovery-e2e.sh
          grep -Fq 'iptables' tools/order083/android-field-recovery-e2e.sh
          grep -Fq 'ROOT_IPTABLES_TCP_443_REJECT' tools/order083/android-field-recovery-e2e.sh
          grep -Fq 'trap restore_network EXIT INT TERM' tools/order083/android-field-recovery-e2e.sh
          ! grep -Fq 'dumpsys connectivity' tools/order083/android-field-recovery-e2e.sh
      - name: Source regression and candidate manifest
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          node --check cloudflare/src/worker.mjs
          node --test cloudflare/test/contracts.test.mjs
          bash -n tools/order083/android-field-recovery-e2e.sh
          node tools/order083/generate-manifests.mjs . "$RUNNER_TEMP/manifest"
          cp "$RUNNER_TEMP/manifest/result.json" "$RUNNER_TEMP/candidate.json"
          curl --fail --silent --show-error "$ZUNGUN_ORIGIN/version" > "$RUNNER_TEMP/before.json"
          test "$(jq -r .staticAssetManifestSha256 "$RUNNER_TEMP/candidate.json")" = "$(jq -r .staticAssetManifestSha256 "$RUNNER_TEMP/before.json")"
          test "$(jq -r .migrationManifestSha256 "$RUNNER_TEMP/candidate.json")" = "$(jq -r .migrationManifestSha256 "$RUNNER_TEMP/before.json")"
          test "$(jq -r .sourceBundleSha256 "$RUNNER_TEMP/candidate.json")" != "$(jq -r .sourceBundleSha256 "$RUNNER_TEMP/before.json")"
      - name: Install Android API35
        shell: bash
        run: |
          set -euo pipefail
          sdkroot="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}";sdkmanager="$sdkroot/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" platform-tools 'platforms;android-35' 'build-tools;35.0.0' emulator 'system-images;android-35;google_apis;x86_64'
          printf 'ANDROID_SDK_ROOT=%s\nANDROID_HOME=%s\n' "$sdkroot" "$sdkroot" >> "$GITHUB_ENV"
          printf '%s\n' "$sdkroot/platform-tools" >> "$GITHUB_PATH"
      - name: Start bounded API35 emulator
        shell: bash
        run: |
          set -euo pipefail
          sdkroot="$ANDROID_SDK_ROOT";export ANDROID_USER_HOME="$RUNNER_TEMP/android-home" ANDROID_EMULATOR_HOME="$RUNNER_TEMP/android-home" ANDROID_AVD_HOME="$RUNNER_TEMP/android-home/avd";mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$sdkroot/cmdline-tools/latest/bin/avdmanager" create avd --force -n order083-outage -k 'system-images;android-35;google_apis;x86_64' --device pixel_6
          sudo chmod 666 /dev/kvm || true
          nohup "$sdkroot/emulator/emulator" -avd order083-outage -no-window -noaudio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -accel auto > "$RUNNER_TEMP/emulator.log" 2>&1 &
          timeout 180s adb wait-for-device
          for _ in $(seq 1 120);do [[ "$(adb shell getprop sys.boot_completed 2>/dev/null|tr -d '\r')" == 1 ]]&&exit 0;sleep 2;done
          cat "$RUNNER_TEMP/emulator.log";exit 1
      - name: Pre-deploy Gate44 Field with application-traffic outage candidate
        shell: bash
        env:
          ORDER083_FIELD_RECOVERY_EVIDENCE: ${{ runner.temp }}/field-predeploy
        run: tools/order083/android-field-recovery-e2e.sh
      - name: Production-first deploy exact candidate and verify live identity
        shell: bash
        env:
          ORDER083_EVIDENCE_DIR: ${{ runner.temp }}/production
        run: |
          set -euo pipefail
          bash tools/order083/deploy-production.sh | tee "$RUNNER_TEMP/deploy.txt"
          curl --fail --silent --show-error "$ZUNGUN_ORIGIN/version" > "$RUNNER_TEMP/after.json"
          for k in sourceBundleSha256 staticAssetManifestSha256 migrationManifestSha256;do test "$(jq -r .$k "$RUNNER_TEMP/candidate.json")" = "$(jq -r .$k "$RUNNER_TEMP/after.json")";done
          node tools/order083/live-e2e.mjs "$RUNNER_TEMP/live"
          test "$(git ls-remote origin "refs/heads/$PR_BRANCH" | awk '{print $1}')" = "$EXPECTED_PR_HEAD"
      - name: Seal carrier evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/seal"
          jq -r .sourceBundleSha256 "$RUNNER_TEMP/candidate.json" > "$RUNNER_TEMP/seal/SOURCE_BUNDLE_SHA256"
          printf 'ORDER=ORDER-083\nPRODUCTION_FIRST=YES\nAPPLICATION_TRAFFIC_OUTAGE=YES\nOUTAGE_ORACLE=REAL_APP_HTTPS\nPREDEPLOY_GATE44_FIELD=PASS\nPROVEN_NOT_SENT_CLASSIFICATION=YES\nAMBIGUOUS_UNKNOWN_BEFORE_PROCESS_DEATH=YES\nPR16_ADVANCED=NO\nMERGE=NO\nORDER082_STARTED=NO\nORDER084_STARTED=NO\n' > "$RUNNER_TEMP/seal/RESULT"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: order083-field-outage-r5-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/candidate.json
            ${{ runner.temp }}/before.json
            ${{ runner.temp }}/after.json
            ${{ runner.temp }}/deploy.txt
            ${{ runner.temp }}/manifest
            ${{ runner.temp }}/field-predeploy
            ${{ runner.temp }}/production
            ${{ runner.temp }}/live
            ${{ runner.temp }}/emulator.log
            ${{ runner.temp }}/seal
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
