name: Order 083 final exact production reconciliation

on:
  push:
    branches: [bootstrap/order-083-production-first]
    paths: [.github/workflows/order-083-final-exact-production.yml]

permissions:
  contents: read
  issues: write

env:
  CI: "true"
  NO_COLOR: "1"
  ZUNGUN_ORIGIN: https://zungun.simondalmasso44.workers.dev
  PR_BRANCH: feat/zungun-full-project-v1
  EXPECTED_PR_HEAD: dc9c893fbbc4a97eddd23aa33a6e82cbbf3d5d73

jobs:
  reconcile-production:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ZUNGUN_PILOT_TOKEN: ${{ secrets.ZUNGUN_PILOT_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.PR_BRANCH }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22.16.0
          package-manager-cache: false
      - name: Reconstruct exact canonical identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_PR_HEAD"
          test "$(git ls-remote origin "refs/heads/$PR_BRANCH" | awk '{print $1}')" = "$EXPECTED_PR_HEAD"
          npm ci --ignore-scripts --no-audit --no-fund
          node tools/order083/generate-manifests.mjs . "$RUNNER_TEMP/candidate" >/dev/null
          cp "$RUNNER_TEMP/candidate/result.json" "$RUNNER_TEMP/candidate.json"
          test "$(jq -r .sourceInventory "$RUNNER_TEMP/candidate.json")" = GIT_TRACKED_WORKTREE_BYTES
      - name: Seal exact production identity with bounded readback
        shell: bash
        run: |
          set -euo pipefail
          matched=NO
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error "$ZUNGUN_ORIGIN/version" > "$RUNNER_TEMP/live-version.json"; then
              source_expected="$(jq -r .sourceBundleSha256 "$RUNNER_TEMP/candidate.json")"
              source_live="$(jq -r .sourceBundleSha256 "$RUNNER_TEMP/live-version.json")"
              static_expected="$(jq -r .staticAssetManifestSha256 "$RUNNER_TEMP/candidate.json")"
              static_live="$(jq -r .staticAssetManifestSha256 "$RUNNER_TEMP/live-version.json")"
              migration_expected="$(jq -r .migrationManifestSha256 "$RUNNER_TEMP/candidate.json")"
              migration_live="$(jq -r .migrationManifestSha256 "$RUNNER_TEMP/live-version.json")"
              if [[ "$source_expected" == "$source_live" && "$static_expected" == "$static_live" && "$migration_expected" == "$migration_live" ]]; then
                matched=YES
                break
              fi
            fi
            sleep 5
          done
          test "$matched" = YES
          printf 'SOURCE=%s\nSTATIC=%s\nMIGRATION=%s\n' \
            "$(jq -r .sourceBundleSha256 "$RUNNER_TEMP/live-version.json")" \
            "$(jq -r .staticAssetManifestSha256 "$RUNNER_TEMP/live-version.json")" \
            "$(jq -r .migrationManifestSha256 "$RUNNER_TEMP/live-version.json")" | tee "$RUNNER_TEMP/identity.txt"
      - name: Final live E2E and exact-head seal
        shell: bash
        run: |
          set -euo pipefail
          node tools/order083/live-e2e.mjs "$RUNNER_TEMP/live"
          for k in sourceBundleSha256 staticAssetManifestSha256 migrationManifestSha256; do
            test "$(jq -r .$k "$RUNNER_TEMP/candidate.json")" = "$(jq -r .$k "$RUNNER_TEMP/live/result.json")"
          done
          test "$(git rev-parse HEAD)" = "$EXPECTED_PR_HEAD"
          test "$(git ls-remote origin "refs/heads/$PR_BRANCH" | awk '{print $1}')" = "$EXPECTED_PR_HEAD"
      - name: Publish final reconciliation evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          source_hash="$(jq -r .sourceBundleSha256 "$RUNNER_TEMP/live-version.json")"
          static_hash="$(jq -r .staticAssetManifestSha256 "$RUNNER_TEMP/live-version.json")"
          migration_hash="$(jq -r .migrationManifestSha256 "$RUNNER_TEMP/live-version.json")"
          printf '%s\n' \
            'ORDER=ORDER-083' \
            'FINAL_EXACT_PRODUCTION_RECONCILIATION=PASS' \
            "PR16_HEAD=$EXPECTED_PR_HEAD" \
            "SOURCE_BUNDLE_SHA256=$source_hash" \
            "STATIC_ASSET_MANIFEST_SHA256=$static_hash" \
            "MIGRATION_MANIFEST_SHA256=$migration_hash" \
            "RUN_ID=${GITHUB_RUN_ID}" \
            'MERGE=NO' \
            'ORDER084_STARTED=NO' \
            'ORDER082_STARTED=NO' > "$RUNNER_TEMP/RESULT"
          body="$(printf 'ORDER083_FINAL_EXACT_PRODUCTION_RECONCILIATION\n\n```text\n%s\n```' "$(cat "$RUNNER_TEMP/RESULT")")"
          jq -n --arg body "$body" '{body:$body}' > "$RUNNER_TEMP/comment.json"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/10/comments" --input "$RUNNER_TEMP/comment.json"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: order083-final-exact-production-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/candidate.json
            ${{ runner.temp }}/live-version.json
            ${{ runner.temp }}/identity.txt
            ${{ runner.temp }}/live
            ${{ runner.temp }}/RESULT
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
