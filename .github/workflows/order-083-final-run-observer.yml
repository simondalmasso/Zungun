name: Order 083 final carrier observer

on:
  push:
    branches: [bootstrap/order-083-production-first]
    paths: [.github/workflows/order-083-final-run-observer.yml]

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_HEAD: 8b89ba7735468891ad93ac0c270849116ceec653
      TARGET_NAME: Order 083 final exact production reconciliation
    steps:
      - name: Locate target carrier and publish pointer
        shell: bash
        run: |
          set -euo pipefail
          runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${TARGET_HEAD}&per_page=100")"
          row="$(jq -c --arg name "$TARGET_NAME" '[.workflow_runs[] | select(.name==$name)] | sort_by(.id) | last // null' <<<"$runs")"
          if [[ "$row" == null ]]; then
            target_run_id=NOT_FOUND
            target_status=NOT_FOUND
            target_conclusion=NOT_FOUND
          else
            target_run_id="$(jq -r .id <<<"$row")"
            target_status="$(jq -r .status <<<"$row")"
            target_conclusion="$(jq -r '.conclusion // "PENDING"' <<<"$row")"
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/10/comments" -f body="ORDER083_FINAL_CARRIER_POINTER

\`\`\`text
OBSERVER_RUN_ID=${GITHUB_RUN_ID}
OBSERVER_HEAD=${GITHUB_SHA}
TARGET_RUN_ID=$target_run_id
TARGET_HEAD=$TARGET_HEAD
TARGET_STATUS=$target_status
TARGET_CONCLUSION=$target_conclusion
\`\`\`"
