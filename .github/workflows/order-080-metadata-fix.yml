name: Order 080 strict metadata repair

"on":
  push:
    branches: [feat/zungun-full-project-v1]
    paths: [.github/workflows/order-080-metadata-fix.yml]

permissions:
  contents: write

jobs:
  repair-verification-metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: feat/zungun-full-project-v1
          fetch-depth: 0
      - name: Add only required JUnit BOM module checksums
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('android/gradle/verification-metadata.xml')
          text = path.read_text()
          additions = {
              '5.9.2': 'ab137ba5a8e32c9b066bf9126a1c76dd5614b724ba5c0b02549772b5e9f4cf1f',
              '5.9.3': 'b401fd25901e582a524aa5343c4b39e28bc56e24961c1069bf2b4bbfcee46b93',
          }
          for version, digest in additions.items():
              artifact = f'junit-bom-{version}.module'
              if artifact in text:
                  continue
              needle = (
                  f'      <component group="org.junit" name="junit-bom" version="{version}">\n'
                  f'         <artifact name="junit-bom-{version}.pom">'
              )
              replacement = (
                  f'      <component group="org.junit" name="junit-bom" version="{version}">\n'
                  f'         <artifact name="{artifact}">\n'
                  f'            <sha256 value="{digest}" origin="Verified against Maven Central artifact metadata"/>\n'
                  f'         </artifact>\n'
                  f'         <artifact name="junit-bom-{version}.pom">'
              )
              if needle not in text:
                  raise SystemExit(f'expected component not found for {version}')
              text = text.replace(needle, replacement, 1)
          path.write_text(text)
          PY
          grep -F 'junit-bom-5.9.2.module' android/gradle/verification-metadata.xml
          grep -F 'ab137ba5a8e32c9b066bf9126a1c76dd5614b724ba5c0b02549772b5e9f4cf1f' android/gradle/verification-metadata.xml
          grep -F 'junit-bom-5.9.3.module' android/gradle/verification-metadata.xml
          grep -F 'b401fd25901e582a524aa5343c4b39e28bc56e24961c1069bf2b4bbfcee46b93' android/gradle/verification-metadata.xml
          git diff --check
          git diff -- android/gradle/verification-metadata.xml
      - name: Commit strict metadata repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- android/gradle/verification-metadata.xml; then
            echo 'metadata already repaired'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/gradle/verification-metadata.xml
          git commit -m 'fix(android): add required JUnit BOM verification hashes'
          git push origin HEAD:feat/zungun-full-project-v1
