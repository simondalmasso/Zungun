name: Order 081 quality diagnostic

"on":
  pull_request:
    branches: [recovery/order-072-oracle-extension-candidate-v1]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: {persist-credentials: false}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with: {node-version: 22.16.0, package-manager-cache: false}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run format:check
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: {persist-credentials: false}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with: {node-version: 22.16.0, package-manager-cache: false}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run lint
  typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: {persist-credentials: false}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with: {node-version: 22.16.0, package-manager-cache: false}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
  link-unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: {persist-credentials: false}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with: {node-version: 22.16.0, package-manager-cache: false}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: node --test dist/tests/link-core.test.js dist/tests/link-capabilities-prefetch-trace.test.js
