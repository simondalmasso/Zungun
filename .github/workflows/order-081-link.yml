name: Order 081 Link verification

"on":
  pull_request:
    branches: [recovery/order-072-oracle-extension-candidate-v1]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: order-081-link-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NO_COLOR: "1"
  NPM_CONFIG_UPDATE_NOTIFIER: "false"
  PROTECTED_CANDIDATE_TREE: 108629fc91c1e03454c18b14a6b557c2b62898d4

jobs:
  link-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      vector_sha: ${{ steps.hashes.outputs.vector_sha }}
      npm_sha: ${{ steps.hashes.outputs.npm_sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with: {node-version: 22.16.0, package-manager-cache: false}
      - name: Install exact-head inputs
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: "Gate 20 — Link core type lint unit integrity"
        shell: bash
        run: |
          set -euo pipefail
          npm run format:check
          npm run lint
          npm run typecheck
          npm run build
          node --test dist/tests/link-core.test.js dist/tests/link-capabilities-prefetch-trace.test.js
          test "$(git rev-parse HEAD:candidate/order-072)" = "$PROTECTED_CANDIDATE_TREE"
          test -z "$(git diff --name-only 8b206b91fb98bc3d514f9709b6258dcb839ad5f1..HEAD | grep -E '^(candidate/order-072|canary/zep-core-canary/vendor/zep-core)/' || true)"
      - name: "Gate 21 — deterministic planner vectors"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp
          node tools/link-vectors/generate.mjs .tmp/link-planner-v1.vectors
          cmp .tmp/link-planner-v1.vectors testdata/link-planner-v1.vectors
          node --test dist/tests/link-core.test.js
      - name: Package and hash core evidence
        id: hashes
        shell: bash
        run: |
          set -euo pipefail
          npm run verify:pack
          vector_sha="$(sha256sum testdata/link-planner-v1.vectors | cut -d' ' -f1)"
          npm_sha="$(jq -r .sha256 .artifacts/npm-package.json)"
          echo "vector_sha=$vector_sha" >> "$GITHUB_OUTPUT"
          echo "npm_sha=$npm_sha" >> "$GITHUB_OUTPUT"
          out="$RUNNER_TEMP/order081-core"; mkdir -p "$out"
          cp testdata/link-planner-v1.vectors "$out/"
          cp .artifacts/npm-package.json "$out/"
          printf '%s\n' "$vector_sha" > "$out/VECTOR_SHA256"
          find "$out" -type f ! -name MANIFEST.sha256 -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$out/MANIFEST.sha256"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with: {name: "order081-link-core-${{ github.run_id }}", path: "${{ runner.temp }}/order081-core", if-no-files-found: error, retention-days: 14, compression-level: 0}

  android-link:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    outputs:
      aar_sha: ${{ steps.android_hash.outputs.aar_sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with: {node-version: 22.16.0, package-manager-cache: false}
      - name: Install Android exact-head inputs
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          sdkroot="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"; sdkmanager="$sdkroot/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" platform-tools 'platforms;android-35' 'build-tools;35.0.0' emulator 'system-images;android-35;google_apis;x86_64'
          printf 'ANDROID_SDK_ROOT=%s\nANDROID_HOME=%s\n' "$sdkroot" "$sdkroot" >> "$GITHUB_ENV"
          printf '%s\n' "$sdkroot/platform-tools" >> "$GITHUB_PATH"
      - name: "Gate 22 — TypeScript Kotlin differential equivalence"
        shell: bash
        run: |
          set -euo pipefail; export JAVA_HOME="$JAVA_HOME_17_X64"
          android/gradle/bootstrap-gradle.sh -p android --no-daemon --stacktrace :runtime:testDebugUnitTest --tests com.zungun.runtime.link.LinkPlannerGoldenTest
      - name: "Gate 23a — Android Link Snapshot unit contract"
        shell: bash
        run: |
          set -euo pipefail; export JAVA_HOME="$JAVA_HOME_17_X64"
          android/gradle/bootstrap-gradle.sh -p android --no-daemon --stacktrace :runtime:testDebugUnitTest --tests com.zungun.runtime.link.LinkSnapshotContractTest
      - name: Start bounded API35 emulator
        shell: bash
        run: |
          set -euo pipefail; sdkroot="$ANDROID_SDK_ROOT"
          export ANDROID_USER_HOME="$RUNNER_TEMP/order081-android-user-home"
          export ANDROID_EMULATOR_HOME="$ANDROID_USER_HOME"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$sdkroot/cmdline-tools/latest/bin/avdmanager" create avd --force -n zungun-link-api35 -k 'system-images;android-35;google_apis;x86_64' --device pixel_6
          "$sdkroot/emulator/emulator" -list-avds | grep -Fx zungun-link-api35
          sudo chmod 666 /dev/kvm || true
          nohup "$sdkroot/emulator/emulator" -avd zungun-link-api35 -no-window -noaudio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -accel auto > "$RUNNER_TEMP/order081-emulator.log" 2>&1 &
          trap 'cat "$RUNNER_TEMP/order081-emulator.log" 2>/dev/null || true; adb emu kill >/dev/null 2>&1 || true' ERR
          timeout 180s adb wait-for-device
          ready=0
          for _ in $(seq 1 120); do
            if adb devices | grep -q $'emulator-.*\tdevice' && [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then cat "$RUNNER_TEMP/order081-emulator.log"; exit 1; fi
      - name: "Gate 23b — Android callback Link Snapshot platform contract"
        shell: bash
        run: |
          set -euo pipefail; export JAVA_HOME="$JAVA_HOME_17_X64"
          android/gradle/bootstrap-gradle.sh -p android --no-daemon --stacktrace :runtime:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.zungun.runtime.LinkNetworkObserverInstrumentedTest
      - name: "Gate 24 — Room Link migrations and recovery"
        shell: bash
        run: |
          set -euo pipefail; export JAVA_HOME="$JAVA_HOME_17_X64"
          android/gradle/bootstrap-gradle.sh -p android --no-daemon --stacktrace :runtime:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.zungun.runtime.DatabaseMigrationTest,com.zungun.runtime.LinkRecoveryInstrumentedTest
      - name: "Gate 25 — priority deadline dependency fairness scheduler"
        shell: bash
        run: |
          set -euo pipefail; export JAVA_HOME="$JAVA_HOME_17_X64"
          android/gradle/bootstrap-gradle.sh -p android --no-daemon --stacktrace :runtime:testDebugUnitTest --tests com.zungun.runtime.link.LinkSchedulerTest
      - name: "Gate 26 — critical core deferred split"
        run: node --test --test-name-pattern='critical core|content-addressed deferred object' dist/tests/link-payload-reconciliation.test.js dist/tests/link-core.test.js
      - name: "Gate 27 — exact-base delta safety"
        run: node --test --test-name-pattern='delta requires exact base' dist/tests/link-payload-reconciliation.test.js dist/tests/link-core.test.js
      - name: "Gate 28 — resumable content-addressed heavy transfer"
        shell: bash
        run: |
          set -euo pipefail; export JAVA_HOME="$JAVA_HOME_17_X64"
          node --test --test-name-pattern='content-addressed deferred object' dist/tests/link-payload-reconciliation.test.js
          android/gradle/bootstrap-gradle.sh -p android --no-daemon --stacktrace :runtime:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.zungun.runtime.LinkDeferredObjectInstrumentedTest
      - name: "Gate 29 — prefetch and good-link opportunity policy"
        run: node --test --test-name-pattern='prefetch|good-link opportunity' dist/tests/link-capabilities-prefetch-trace.test.js dist/tests/link-prefetch-android-source.test.js
      - name: "Gate 30 — transport adapter and network-binding safety"
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -n -E 'bindProcessToNetwork|setProcessDefaultNetwork' android/runtime/src/main
          grep -q 'val network: Network?' android/runtime/src/main/java/com/zungun/runtime/link/DeferredTransferAdapter.kt
          grep -q 'registerDefaultNetworkCallback' android/runtime/src/main/java/com/zungun/runtime/link/LinkNetworkObserver.kt
          node --test --test-name-pattern='hedging is off' dist/tests/link-payload-reconciliation.test.js
      - name: Build and hash Android AAR
        id: android_hash
        shell: bash
        run: |
          set -euo pipefail; export JAVA_HOME="$JAVA_HOME_17_X64"
          android/gradle/bootstrap-gradle.sh -p android --no-daemon --stacktrace :runtime:assembleRelease
          aar=android/runtime/build/outputs/aar/runtime-release.aar; test -s "$aar"
          aar_sha="$(sha256sum "$aar" | cut -d' ' -f1)"; echo "aar_sha=$aar_sha" >> "$GITHUB_OUTPUT"
          out="$RUNNER_TEMP/order081-android"; mkdir -p "$out"; cp "$aar" "$out/zungun-runtime-release.aar"; cp "$RUNNER_TEMP/order081-emulator.log" "$out/"
          printf '%s\n' "$aar_sha" > "$out/AAR_SHA256"; find "$out" -type f ! -name MANIFEST.sha256 -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$out/MANIFEST.sha256"
          adb emu kill || true
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with: {name: "order081-android-${{ github.run_id }}", path: "${{ runner.temp }}/order081-android", if-no-files-found: error, retention-days: 14, compression-level: 0}

  receiver-developer-link:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      doctor_sha: ${{ steps.service_hashes.outputs.doctor_sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with: {node-version: 22.16.0, package-manager-cache: false}
      - run: npm ci --ignore-scripts --no-audit --no-fund && npm run build
      - name: "Gate 31 — reconcile before retry"
        run: node --test --test-name-pattern='ambiguous durable acceptance|bounded authoritative' dist/tests/link-payload-reconciliation.test.js
      - name: "Gate 32 — Receiver Proxy L1 security and compatibility"
        run: node --test dist/tests/link-proxy.test.js dist/tests/link-security-negative.test.js
      - name: "Gate 33 — Link Doctor and OpenAPI scaffold"
        shell: bash
        run: |
          set -euo pipefail; mkdir -p .tmp
          node dist/tools/link-doctor/src/cli.js --openapi testdata/link-doctor-openapi.yaml --format json > .tmp/link-doctor.json
          node dist/tools/link-doctor/src/cli.js --openapi testdata/link-doctor-openapi.yaml --format json > .tmp/link-doctor.second.json
          cmp .tmp/link-doctor.json .tmp/link-doctor.second.json
          grep -q 'UNKNOWN_REQUIRES_ANNOTATION' .tmp/link-doctor.json
          node --test dist/tests/link-doctor.test.js
      - name: "Gate 34 — Link Witness Proof Bundle Control Room"
        shell: bash
        run: |
          set -euo pipefail
          node --test dist/tests/link-proof-control-room.test.js dist/tests/link-control-room-static.test.js
          npm run test:witness
          node tools/quality/verify-link-witness-integration.mjs | tee .tmp/link-witness-integration.json
          jq -e '.ok == true' .tmp/link-witness-integration.json >/dev/null
      - name: Security scans and service evidence
        id: service_hashes
        shell: bash
        run: |
          set -euo pipefail
          npm run verify:secrets
          npm run verify:security-evidence
          doctor_sha="$(sha256sum .tmp/link-doctor.json | cut -d' ' -f1)"; echo "doctor_sha=$doctor_sha" >> "$GITHUB_OUTPUT"
          out="$RUNNER_TEMP/order081-service"; mkdir -p "$out"; cp .tmp/link-doctor.json .tmp/link-witness-integration.json "$out/"
          printf '%s\n' "$doctor_sha" > "$out/DOCTOR_SHA256"; find "$out" -type f ! -name MANIFEST.sha256 -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$out/MANIFEST.sha256"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with: {name: "order081-service-${{ github.run_id }}", path: "${{ runner.temp }}/order081-service", if-no-files-found: error, retention-days: 14, compression-level: 0}

  resilience-link:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      proof_sha: ${{ steps.resilience_hash.outputs.proof_sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with: {node-version: 22.16.0, package-manager-cache: false}
      - run: npm ci --ignore-scripts --no-audit --no-fund && npm run build
      - name: "Gate 35 — Resilience Lab and Link Blackout Drill"
        shell: bash
        run: |
          set -euo pipefail
          node --test dist/tests/link-resilience-matrix.test.js dist/tests/link-blackout.test.js dist/tests/link-quickstart.test.js
          npm run test:resilience
          npm run generate:link-proof
          cp .artifacts/link/blackout-proof-bundle.json "$RUNNER_TEMP/link-proof.first.json"
          npm run generate:link-proof
          cmp "$RUNNER_TEMP/link-proof.first.json" .artifacts/link/blackout-proof-bundle.json
          npm run demo:link > "$RUNNER_TEMP/link-quickstart.txt"
          grep -q '"secondSideEffectSendCount": 0' "$RUNNER_TEMP/link-quickstart.txt"
      - name: Seal resilience evidence
        id: resilience_hash
        shell: bash
        run: |
          set -euo pipefail
          proof_sha="$(sha256sum .artifacts/link/blackout-proof-bundle.json | cut -d' ' -f1)"; echo "proof_sha=$proof_sha" >> "$GITHUB_OUTPUT"
          out="$RUNNER_TEMP/order081-resilience"; mkdir -p "$out"; cp .artifacts/link/blackout-proof-bundle.json "$out/"; cp "$RUNNER_TEMP/link-quickstart.txt" "$out/"
          printf '%s\n' "$proof_sha" > "$out/PROOF_SHA256"; find "$out" -type f ! -name MANIFEST.sha256 -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$out/MANIFEST.sha256"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with: {name: "order081-resilience-${{ github.run_id }}", path: "${{ runner.temp }}/order081-resilience", if-no-files-found: error, retention-days: 14, compression-level: 0}

  completion:
    if: always()
    needs: [link-core, android-link, receiver-developer-link, resilience-link]
    runs-on: ubuntu-24.04
    timeout-minutes: 190
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: "Gate 36 — exact-head 01-35 completion seal"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          CORE_RESULT: ${{ needs.link-core.result }}
          ANDROID_RESULT: ${{ needs.android-link.result }}
          SERVICE_RESULT: ${{ needs.receiver-developer-link.result }}
          RESILIENCE_RESULT: ${{ needs.resilience-link.result }}
          VECTOR_SHA: ${{ needs.link-core.outputs.vector_sha }}
          NPM_SHA: ${{ needs.link-core.outputs.npm_sha }}
          AAR_SHA: ${{ needs.android-link.outputs.aar_sha }}
          DOCTOR_SHA: ${{ needs.receiver-developer-link.outputs.doctor_sha }}
          PROOF_SHA: ${{ needs.resilience-link.outputs.proof_sha }}
        run: |
          set -euo pipefail
          test "$CORE_RESULT" = success; test "$ANDROID_RESULT" = success; test "$SERVICE_RESULT" = success; test "$RESILIENCE_RESULT" = success
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          baseline_run=""
          for _ in $(seq 1 340); do
            json="$(curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/order-075-full-project.yml/runs?head_sha=${HEAD_SHA}&event=pull_request&per_page=20")"
            baseline_run="$(jq -r '[.workflow_runs[] | select(.head_sha==env.HEAD_SHA and .conclusion=="success")][0].id // empty' <<<"$json")"
            [ -n "$baseline_run" ] && break
            terminal_bad="$(jq -r '[.workflow_runs[] | select(.head_sha==env.HEAD_SHA and (.conclusion=="failure" or .conclusion=="cancelled" or .conclusion=="timed_out"))][0].conclusion // empty' <<<"$json")"
            [ -n "$terminal_bad" ] && { echo "Order077 same-head terminal=$terminal_bad"; exit 1; }
            sleep 30
          done
          test -n "$baseline_run"
          out="$RUNNER_TEMP/order081-completion"; mkdir -p "$out"
          jq -n --arg head "$HEAD_SHA" --arg tree "$(git rev-parse HEAD^{tree})" --arg baselineRun "$baseline_run" --arg vector "$VECTOR_SHA" --arg npm "$NPM_SHA" --arg aar "$AAR_SHA" --arg doctor "$DOCTOR_SHA" --arg proof "$PROOF_SHA" '{orderId:"ZUNGUN-OWNER-ARQ-SEMANTIC-CONNECTIVITY-RUNTIME-081",ok:true,head:$head,tree:$tree,baselineOrder077RunId:$baselineRun,gates01_36:"SUCCESS",requiredGatesSkipped:0,vectorCorpusSha256:$vector,npmPackageSha256:$npm,androidAarSha256:$aar,linkDoctorFixtureSha256:$doctor,proofFixtureSha256:$proof,forcePush:false,merge:false,deploy:false,release:false,productionMutations:0,costUsd:0}' > "$out/result.json"
          git status --porcelain=v1 > "$out/git-status.txt"
          test ! -s "$out/git-status.txt"
          find "$out" -type f ! -name MANIFEST.sha256 -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$out/MANIFEST.sha256"
          echo "$baseline_run" > "$out/BASELINE_ORDER077_RUN_ID"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with: {name: "order081-completion-${{ github.run_id }}", path: "${{ runner.temp }}/order081-completion", if-no-files-found: error, retention-days: 14, compression-level: 0}
