name: Order 083 field recovery diagnostic

on:
  push:
    branches: [bootstrap/order-083-production-first]
    paths: [.github/workflows/order-083-field-recovery-diagnostic.yml]

permissions:
  contents: read

env:
  CI: "true"
  NO_COLOR: "1"
  ZUNGUN_ORIGIN: https://zungun.simondalmasso44.workers.dev
  EXPECTED_HEAD: dc9c893fbbc4a97eddd23aa33a6e82cbbf3d5d73

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ZUNGUN_PILOT_TOKEN: ${{ secrets.ZUNGUN_PILOT_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          persist-credentials: false
      - name: Fail closed and apply direct startup recovery candidate only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          remote="$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/feat/zungun-full-project-v1 | cut -f1)"
          test "$remote" = "$EXPECTED_HEAD"
          python - <<'PY'
          from pathlib import Path
          p=Path('android/runtime/src/main/java/com/zungun/runtime/link/LinkNetworkWakeRegistry.kt')
          s=p.read_text()
          anchor='import java.util.concurrent.atomic.AtomicBoolean\n'
          imports='import java.util.concurrent.atomic.AtomicBoolean\nimport kotlinx.coroutines.CoroutineScope\nimport kotlinx.coroutines.Dispatchers\nimport kotlinx.coroutines.SupervisorJob\nimport kotlinx.coroutines.launch\n'
          if s.count(anchor)!=1: raise SystemExit('IMPORT_ANCHOR_INVALID')
          s=s.replace(anchor,imports,1)
          anchor2='    private val wakeOutstanding = AtomicBoolean(false)\n'
          repl2='    private val wakeOutstanding = AtomicBoolean(false)\n    private val startupRecoveryScope = CoroutineScope(SupervisorJob() + Dispatchers.IO)\n'
          if s.count(anchor2)!=1: raise SystemExit('SCOPE_ANCHOR_INVALID')
          s=s.replace(anchor2,repl2,1)
          anchor3='        observer = LinkNetworkObserver(app) { snapshot -> acceptSnapshot(app, snapshot) }\n            .also { it.start() }\n'
          repl3='        observer = LinkNetworkObserver(app) { snapshot -> acceptSnapshot(app, snapshot) }\n            .also { it.start() }\n        startupRecoveryScope.launch { LinkNetworkWakeDispatcher.dispatch(app) }\n'
          if s.count(anchor3)!=1: raise SystemExit('STARTUP_ANCHOR_INVALID')
          s=s.replace(anchor3,repl3,1)
          p.write_text(s)
          PY
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "android/runtime/src/main/java/com/zungun/runtime/link/LinkNetworkWakeRegistry.kt"
          git diff -- android/runtime/src/main/java/com/zungun/runtime/link/LinkNetworkWakeRegistry.kt
      - name: Install Android API35
        shell: bash
        run: |
          set -euo pipefail
          sdkroot="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sdkmanager="$sdkroot/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" platform-tools 'platforms;android-35' 'build-tools;35.0.0' emulator 'system-images;android-35;google_apis;x86_64'
          printf 'ANDROID_SDK_ROOT=%s\nANDROID_HOME=%s\n' "$sdkroot" "$sdkroot" >> "$GITHUB_ENV"
          printf '%s\n' "$sdkroot/platform-tools" >> "$GITHUB_PATH"
      - name: Start bounded API35 emulator
        shell: bash
        run: |
          set -euo pipefail
          sdkroot="$ANDROID_SDK_ROOT"
          export ANDROID_USER_HOME="$RUNNER_TEMP/order083-android-home" ANDROID_EMULATOR_HOME="$RUNNER_TEMP/order083-android-home" ANDROID_AVD_HOME="$RUNNER_TEMP/order083-android-home/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$sdkroot/cmdline-tools/latest/bin/avdmanager" create avd --force -n order083-api35 -k 'system-images;android-35;google_apis;x86_64' --device pixel_6
          sudo chmod 666 /dev/kvm || true
          nohup "$sdkroot/emulator/emulator" -avd order083-api35 -no-window -noaudio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -accel auto > "$RUNNER_TEMP/order083-emulator.log" 2>&1 &
          timeout 180s adb wait-for-device
          for _ in $(seq 1 120); do [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == 1 ]] && exit 0; sleep 2; done
          cat "$RUNNER_TEMP/order083-emulator.log"; exit 1
      - name: Run full Gate44 field candidate without test bypass
        env:
          ORDER083_FIELD_RECOVERY_EVIDENCE: ${{ runner.temp }}/order083-field-recovery-candidate
        run: tools/order083/android-field-recovery-e2e.sh
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: order083-field-recovery-candidate-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/order083-field-recovery-candidate
            ${{ runner.temp }}/order083-emulator.log
          if-no-files-found: warn
          retention-days: 3
          compression-level: 0
