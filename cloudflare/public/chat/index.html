<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111311">
<meta name="description" content="Zungun — chat">
<meta name="robots" content="noindex,nofollow,noarchive">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>Zungun</title>
<link rel="stylesheet" href="./app.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand-mark" aria-hidden="true">z</div>
    <div class="brand-name">zungun</div>
    <span class="connection"><i id="connectionDot"></i><span id="connectionState">Conectando</span></span>
  </header>

  <main>
    <section id="authView" class="auth-view">
      <div class="auth-mark" aria-hidden="true">z</div>
      <h1>Hablemos.</h1>
      <p>¿Cómo te llamás?</p>
      <form id="accountForm">
        <input id="displayName" name="displayName" maxlength="80" autocomplete="nickname" placeholder="Tu nombre" aria-label="Tu nombre" required>
        <button class="primary" id="createAccount" type="submit">Entrar al chat <span aria-hidden="true">→</span></button>
        <p id="accountError" class="error" role="alert"></p>
      </form>
    </section>

    <section id="chatView" class="chat-view hidden">
      <aside id="sidebar" class="sidebar">
        <div class="my-account">
          <div class="avatar" id="myAvatar">z</div>
          <div class="account-copy">
            <strong id="myName">Zungun</strong>
            <button id="copyCode" class="code-button" type="button">Tu código · <span id="myCode">--------</span> <span aria-hidden="true">↗</span></button>
          </div>
          <button id="signOut" class="icon-button signout" type="button" aria-label="Cerrar sesión" title="Cerrar sesión">↪</button>
        </div>
        <div class="sidebar-title"><span>Chats</span><button id="newChat" class="new-chat" type="button" aria-label="Nuevo chat" title="Nuevo chat">+</button></div>
        <form id="pairForm" class="pair-form hidden">
          <label for="pairCode">Código de la otra persona</label>
          <div class="pair-row"><input id="pairCode" name="pairCode" maxlength="12" autocomplete="off" placeholder="ABC12345" required><button type="submit" aria-label="Iniciar chat">→</button></div>
          <p id="pairError" class="error" role="alert"></p>
        </form>
        <div id="conversationList" class="conversation-list">
          <div class="list-empty">Tus conversaciones aparecen acá.</div>
        </div>
      </aside>

      <section class="workspace">
        <div id="emptyChat" class="empty-chat">
          <div class="empty-mark" aria-hidden="true">z</div>
          <h1>Empezá una conversación.</h1>
          <button id="startChat" class="primary" type="button">Nuevo chat <span aria-hidden="true">+</span></button>
        </div>

        <section id="conversationPane" class="conversation-pane hidden">
          <header class="chat-header">
            <button id="backToChats" class="icon-button back-button" type="button" aria-label="Volver a chats">←</button>
            <div class="avatar small-avatar" id="peerAvatar">z</div>
            <div class="peer-info"><strong id="chatTitle">Chat</strong><span id="peerCode"></span></div>
          </header>
          <div id="messages" class="messages" aria-live="polite" aria-relevant="additions text">
            <div class="loading">Cargando mensajes…</div>
          </div>
          <form id="sendForm" class="composer">
            <input id="messageInput" name="body" maxlength="2000" autocomplete="off" placeholder="Escribí un mensaje…" aria-label="Escribí un mensaje" required>
            <button id="sendButton" class="send-button" type="submit" aria-label="Enviar mensaje" title="Enviar mensaje">↑</button>
          </form>
          <p id="sendError" class="send-error" role="alert"></p>
        </section>
      </section>
    </section>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</div>
<script src="./app.js" defer></script>
</body>
</html>
