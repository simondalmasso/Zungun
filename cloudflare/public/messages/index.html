<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>Zungun Messages</title><link rel="stylesheet" href="/app.css"></head><body><main class="shell"><header class="topbar"><a class="brand" href="/">Zungun</a><nav class="nav" aria-label="Primary"><a data-nav="control" href="/control">Control</a><a data-nav="messages" href="/messages">Messages</a><a data-nav="developers" href="/developers">Developers</a><a href="/ops">Ops</a></nav></header><section class="hero"><div class="eyebrow">Zungun Messages</div><h1>Text. No pretend presence.</h1><p><strong>Sent</strong> means the server durably accepted the exact message. <strong>Delivered</strong> appears only after the recipient client sends a durable ACK.</p></section><section class="grid"><article class="card"><h2>Account</h2><div id="account"></div><hr><form id="pair" class="stack"><input name="code" maxlength="12" required placeholder="Another person's pairing code"><button>Start conversation</button><div id="pair-error" class="error"></div></form><div id="conversations" class="list"></div></article><article class="card"><div class="row"><h2 id="chat-title">Choose a conversation</h2><span id="socket" class="status">Offline</span></div><div id="messages" class="list" aria-live="polite"></div><form id="send" class="row"><input name="body" maxlength="2000" required placeholder="Message" autocomplete="off"><button class="primary">Send</button></form><div id="send-error" class="error"></div></article></section></main><script type="module" src="/messages/messages.js"></script></body></html>
