<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>Zungun Control</title><link rel="stylesheet" href="/app.css"></head><body><main class="shell"><header class="topbar"><a class="brand" href="/">Zungun</a><nav class="nav" aria-label="Primary"><a data-nav="control" href="/control">Control</a><a data-nav="messages" href="/messages">Messages</a><a data-nav="developers" href="/developers">Developers</a><a href="/ops">Ops</a></nav></header><section class="hero"><div class="eyebrow">Zungun Control</div><h1>Assign work. See proof.</h1><p>Create one bounded work order and watch its persisted outcome without optimistic completion.</p></section><section class="grid"><article class="card"><h2>Account</h2><div id="account"></div></article><article class="card"><h2>New work order</h2><form id="create" class="stack"><input name="title" maxlength="120" required placeholder="Title"><textarea name="description" maxlength="1000" rows="3" placeholder="Short description"></textarea><input name="locationText" maxlength="240" placeholder="Location (optional)"><input name="assigneeCode" maxlength="12" required placeholder="Assignee pairing code"><label class="muted">Expires in <select name="minutes"><option value="60">1 hour</option><option value="240">4 hours</option><option value="1440">1 day</option></select></label><button class="primary">Create work order</button><div id="create-error" class="error"></div></form></article><article class="card full"><div class="row"><h2>Created work</h2><button id="refresh">Refresh</button></div><div id="orders" class="list"></div></article></section></main><script type="module" src="/control/control.js"></script></body></html>
